name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-contract:
    name: API contract lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/openapi.yaml

  backend:
    name: Back end (lint, unit, integration, modularity)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      # `check` = spotlessCheck + all tests (Testcontainers: PostgreSQL, SeaweedFS S3).
      - run: ./gradlew check --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
      - name: Upload module documentation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: backend/build/spring-modulith-docs

  frontend:
    name: Front end (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Builds both images, starts the full stack with Docker Compose and runs the
  # Playwright smoke tests against it: browser → Next.js → API → DB/S3 → worker.
  e2e:
    name: End-to-end (full stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f infra/local/compose.yml --profile app up -d --build --wait --wait-timeout 300
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Wait for the worker heartbeat
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"UP"' && exit 0
            sleep 2
          done
          curl -sS http://localhost:8080/api/v1/health; exit 1
      - working-directory: frontend
        env: { E2E_BASE_URL: "http://localhost:3000", E2E_EXPECT_API: "true" }
        run: pnpm test:e2e
      - name: Worker processed the API's startup probe
        run: docker compose -f infra/local/compose.yml logs worker | grep -q "Startup probe from API instance"
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/local/compose.yml --profile app logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    name: Build and push images
    needs: [e2e, api-contract]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ERIKA_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    name: Deploy to staging
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment files
        run: scp -r infra/staging/compose.yml infra/staging/Caddyfile infra/staging/deploy.sh infra/staging/postgres "${{ secrets.STAGING_SSH_TARGET }}:/opt/erika/"
      - name: Deploy (with health check and automatic rollback)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh "${{ secrets.STAGING_SSH_TARGET }}" "cd /opt/erika && ./deploy.sh '$VERSION'"
