name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      spike:
        description: Run spike S2-a (Mustangproject + veraPDF)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache official test suites
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/erika-test-suites
          key: test-suites-${{ hashFiles('build.gradle.kts') }}
      - run: ./gradlew check --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-reports, path: build/reports }

  spike:
    if: github.event_name == 'workflow_dispatch' && inputs.spike
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spikeTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: spike-output, path: build/spike }

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches version
        run: test "v$(grep '^version=' gradle.properties | cut -d= -f2)" = "${GITHUB_REF_NAME}"
      - run: ./gradlew publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
