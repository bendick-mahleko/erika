name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-contract:
    name: API contract lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/openapi.yaml
      # Internal endpoints for the mail server (not generated, ADR 0024).
      - run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/internal.yaml
      - run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/webhooks.yaml
      # MARA technician app (ADR 0036-0038); generated into Kotlin like openapi.yaml.
      - run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/mobile.yaml

  # Stage 7 (ADR 0027–0029): everything in infra/ is checked by its own tool.
  infra:
    name: Infrastructure (Terraform, Ansible, monitoring, scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -S warning -x --source-path=SCRIPTDIR \
            infra/backup/*.sh infra/backup/drill/run-local-drill.sh infra/production/app/deploy.sh \
            infra/staging/deploy.sh infra/postgres/erika-entrypoint.sh infra/postgres/gosu-setpriv.sh infra/postgres/init/01-roles.sh infra/mail/entrypoint.sh
      - name: Alert rules and their unit tests ("alerts fire in a test")
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm -v "$PWD/infra/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v3.5.0 test rules tests/alerts.test.yml
      - name: Prometheus, Alertmanager, Blackbox, Loki, Alloy configuration
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/src:ro" --entrypoint sh prom/prometheus:v3.5.0 -c \
            'cp /src/alerts.yml /tmp/alerts.yml && sed "s#/etc/prometheus/alerts.yml#/tmp/alerts.yml#" /src/prometheus/prometheus.yml > /tmp/p.yml && promtool check config /tmp/p.yml'
          pip install -q jinja2
          for push in False True; do
            python3 -c "import jinja2; print(jinja2.Template(open('infra/monitoring/alertmanager/alertmanager.yml.j2').read()).render(erika_alert_smtp_host='smtp.example', erika_alert_smtp_user='u', erika_alert_mail_from='m@example.org', erika_alert_email_to='ops@example.org', erika_alert_pushover_enabled=$push))" > "$RUNNER_TEMP/am-$push.yml"
            docker run --rm -v "$RUNNER_TEMP:/c:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config "/c/am-$push.yml"
          done
          docker run --rm -v "$PWD/infra/monitoring/blackbox:/b:ro" prom/blackbox-exporter:v0.27.0 --config.file=/b/blackbox.yml --config.check
          docker run --rm -v "$PWD/infra/monitoring/loki:/l:ro" grafana/loki:3.5.3 -config.file=/l/loki.yml -verify-config
          docker run --rm -v "$PWD/infra/monitoring/alloy:/a:ro" grafana/alloy:v1.10.2 fmt /a/config.alloy > /dev/null
      - name: Caddyfiles
        run: |
          for f in infra/production/app/Caddyfile infra/production/ops/Caddyfile infra/staging/Caddyfile; do
            docker run --rm -e ERIKA_DOMAIN=erika.example -e ERIKA_MAIL_HOSTNAME=mx.erika.example -e ERIKA_ACME_EMAIL=ops@erika.example \
              -e STAGING_USER=u -e STAGING_PASSWORD_HASH='$2a$14$LdBIUeP2jWNFJtb4Dfw64OvBqGZvh/xkeLu0JtPxlYz1gUUBwvFOq' \
              -v "$PWD/$f:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Terraform
        run: |
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf hashicorp/terraform:1.13 fmt -check -recursive
          docker run --rm -v "$PWD/infra/terraform:/tf" -w /tf -e TF_DATA_DIR=/tmp/tf --entrypoint sh hashicorp/terraform:1.13 \
            -c 'terraform init -backend=false -input=false > /dev/null && terraform validate'
      - name: Ansible
        working-directory: infra/ansible
        run: |
          pip install -q "ansible-core==2.19.*" ansible-lint
          ansible-galaxy collection install -r requirements.yml
          cp inventory/production.yml.example inventory/production.yml
          ansible-playbook site.yml --syntax-check
          ansible-lint --offline site.yml roles

  backend:
    name: Back end (lint, unit, integration, modularity)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache pinned downloads (validation packs, test suites)
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/erika-downloads
          key: erika-downloads-${{ hashFiles('validation-packs/*/pack.json', 'backend/build.gradle.kts') }}
      # `check` = spotlessCheck + all tests (Testcontainers: PostgreSQL, SeaweedFS S3, Mailpit).
      # invoice-core is built from source as part of it (composite build, ADR 0020).
      - run: ./gradlew check --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
      - name: Upload module documentation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: modulith-docs
          path: backend/build/spring-modulith-docs

  # MARA technician app (Flutter, MARA build plan Stage 1). Same pinned image as locally
  # (mobile/README.md). The shared vectors in mara-rules/ are read by these tests and by the
  # back end's AufmassVectorsTest.
  mobile:
    name: Mobile app (format, analyze, test, Android build)
    runs-on: ubuntu-24.04
    container: ghcr.io/cirruslabs/flutter:3.44.0
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: pub-${{ hashFiles('mobile/pubspec.lock') }}
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --line-length 100 --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  # iOS builds need macOS runners, which cost more minutes: main only (spike S1-b, ADR 0036).
  mobile-ios:
    name: Mobile app (iOS build, no signing)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [mobile]
    runs-on: macos-15
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.0, channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --debug --no-codesign

  frontend:
    name: Front end (lint, typecheck, build)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # Builds both images, starts the full stack with Docker Compose and runs the
  # Playwright smoke tests against it: browser → Next.js → API → DB/S3 → worker.
  e2e:
    name: End-to-end (full stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose -f infra/local/compose.yml --profile app up -d --build --wait --wait-timeout 600
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Wait for the worker heartbeat
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health | grep -q '"status":"UP"' && exit 0
            sleep 2
          done
          curl -sS http://localhost:8080/api/v1/health; exit 1
      - working-directory: frontend
        env: { E2E_BASE_URL: "http://localhost:3000", E2E_EXPECT_API: "true" }
        run: pnpm test:e2e
      # Stage 11 (ADR 0034): passive security scan of the running web app; fails on the rules marked
      # FAIL in .zap/rules.tsv (missing CSP or security headers, secrets in URLs, error disclosure).
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/.zap:/zap/rules:ro" -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t http://localhost:3000 -m 3 -I -c /zap/rules/rules.tsv -r zap-report.html
      # Known vulnerabilities with an available fix in the images we ship (HIGH and CRITICAL fail the build).
      - name: Image vulnerability scan (Trivy)
        run: |
          for image in erika-backend:local erika-frontend:local erika-mail:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image               --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.html
      - name: Mail server delivered to the API (email intake test)
        run: docker compose -f infra/local/compose.yml --profile app logs mail | grep -q "status=sent"
      - name: Worker processed the API's startup probe
        run: docker compose -f infra/local/compose.yml logs worker | grep -q "Startup probe from API instance"
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/local/compose.yml --profile app logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  images:
    name: Build and push images
    needs: [e2e, api-contract]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend, mail]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ERIKA_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-staging:
    name: Deploy to staging
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment files
        run: |
          ssh "${{ secrets.STAGING_SSH_TARGET }}" "mkdir -p /opt/erika/postgres-init /opt/erika/backup"
          scp infra/staging/compose.yml infra/staging/Caddyfile infra/staging/deploy.sh infra/production/invite.py "${{ secrets.STAGING_SSH_TARGET }}:/opt/erika/"
          scp infra/postgres/init/01-roles.sh "${{ secrets.STAGING_SSH_TARGET }}:/opt/erika/postgres-init/"
          scp infra/backup/*.sh "${{ secrets.STAGING_SSH_TARGET }}:/opt/erika/backup/"
      - name: Deploy (with health check and automatic rollback)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh "${{ secrets.STAGING_SSH_TARGET }}" "cd /opt/erika && ./deploy.sh '$VERSION'"

  # Production (ADR 0027): after staging, with a required reviewer on the GitHub environment
  # "production". Runs on the self-hosted runner on the ops server, which reaches the app
  # server over the private network; its key may only run deploy.sh <version> (forced command).
  # Configuration files are deployed by Ansible, not here.
  deploy-production:
    name: Deploy to production
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, erika-ops]
    environment: production
    concurrency: deploy-production
    steps:
      - name: Deploy (WAL check, health check and automatic rollback)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ssh -o BatchMode=yes erika@10.0.1.10 "$VERSION"
