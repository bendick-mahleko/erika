# MARA Stage 9: builds the technician app for the field test and uploads it to Google Play
# internal testing and TestFlight. Started by hand; the signing material and store credentials
# live in the GitHub environment "mobile-release" (docs/mara/field-test/distribution.md), never
# in the repository.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "MARA_ENVIRONMENT shown in GlitchTip"
        type: choice
        options: [field-test, production]
        default: field-test
      android:
        description: "Upload to Google Play internal testing"
        type: boolean
        default: true
      ios:
        description: "Upload to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  android:
    if: inputs.android
    name: Android (Google Play internal testing)
    runs-on: ubuntu-24.04
    environment: mobile-release
    container: ghcr.io/cirruslabs/flutter:3.44.0
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Upload key from the environment's secret
        env:
          KEYSTORE_BASE64: ${{ secrets.MARA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "MARA_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the app bundle
        env:
          MARA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MARA_UPLOAD_KEYSTORE_PASSWORD }}
          MARA_UPLOAD_KEY_ALIAS: ${{ secrets.MARA_UPLOAD_KEY_ALIAS }}
          MARA_UPLOAD_KEY_PASSWORD: ${{ secrets.MARA_UPLOAD_KEY_PASSWORD }}
        run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --dart-define=MARA_API_BASE_URL=${{ vars.MARA_API_BASE_URL }}
          --dart-define=MARA_SENTRY_DSN=${{ secrets.MARA_SENTRY_DSN }}
          --dart-define=MARA_ENVIRONMENT=${{ inputs.environment }}
      - run: tool/check_size.sh build/app/outputs/bundle/release/app-release.aab 60
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.erika.mara
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    if: inputs.ios
    name: iOS (TestFlight)
    runs-on: macos-15
    environment: mobile-release
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.44.0, channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      - uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: de.erika.mara
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Build the IPA
        run: >
          flutter build ipa --release
          --build-number=${{ github.run_number }}
          --export-options-plist=ios/ExportOptions.plist
          --dart-define=MARA_API_BASE_URL=${{ vars.MARA_API_BASE_URL }}
          --dart-define=MARA_SENTRY_DSN=${{ secrets.MARA_SENTRY_DSN }}
          --dart-define=MARA_ENVIRONMENT=${{ inputs.environment }}
      - run: tool/check_size.sh "$(ls build/ios/ipa/*.ipa)" 60
      - uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: mobile/build/ios/ipa/mara.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
