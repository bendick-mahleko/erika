group=de.erika
# Semantic versioning: 0.x while the API settles; 1.0 before the trades app uses it.
version=0.6.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin usage statistics off: with a large ~/.gradle/kotlin-profile they stall builds.
kotlin.internal.collectFUSMetrics=false
kotlin.code.style=official
