openapi: 3.1.0
info:
  title: ERIKA mobile API (MARA job reports)
  version: 0.7.0
  summary: Endpoints for the MARA technician app (ADR 0036–0038)
  description: |
    Contract for the MARA mobile app. This file is the source of truth: the Kotlin server
    interfaces are generated from it (package `de.erika.contract.mobile`).

    Conventions (the same as `openapi.yaml`, unless noted):
    - Base path `/api/v1/mobile`, JSON, UTF-8, ISO 8601 dates.
    - The workspace comes from the access token, never from the URL or the body.
    - Errors are RFC 9457 problem details with a stable `code`.

    Authentication (ADR 0037): **bearer access tokens**, not session cookies, so there is no
    CSRF token. A device signs in once with password and TOTP and gets a short-lived access
    token and a rotating refresh token. Only the operations marked `security: []` work
    without a token; `MobileContractIT` checks that list.

    Versioning: every sync request carries `protocolVersion`; the server supports the current
    and the previous version (ADR 0038). The app sends its version in `X-App-Version`.
servers:
  - url: /api/v1
security:
  - deviceToken: []
tags:
  - name: mobile
    description: App and device status
  - name: mobile-auth
    description: Device sign-in, token renewal and sign-out (ADR 0037)
  - name: mobile-sync
    description: Push and pull of syncable records (ADR 0038)
  - name: mobile-uploads
    description: Resumable photo uploads with the tus protocol (MARA Stage 6, ADR 0040)
paths:
  /mobile/status:
    get:
      tags: [mobile]
      operationId: getMobileStatus
      summary: Server status for the app (protocol versions, minimum app version, server time)
      description: |
        Answers without a token, so the app can check before signing in whether it is still
        supported and how far its clock is off (the sync engine records clock skew).
        `appUpdate` compares `X-App-Version` with the minimum and the recommended version:
        REQUIRED below the minimum, RECOMMENDED below the recommended version, otherwise NONE
        (also when the header is missing or not a version).

        The device-specific check (revoked device, ADR 0037) is
        `GET /mobile/devices/me/status`, with a token.
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/auth/totp-enrolment:
    post:
      tags: [mobile-auth]
      operationId: startMobileTotpEnrolment
      summary: Start setting up two-factor authentication from the app
      description: |
        For an account without 2FA (technicians never use the web app, ADR 0039). Checks email
        and password and creates a new, not yet confirmed authenticator secret. The app shows
        the secret and offers the `otpauth://` link; the next `device-login` with a code from
        the authenticator app confirms it and returns the recovery codes.

        `409 TOTP_ALREADY_ENABLED` when the account already has 2FA. Wrong passwords count
        towards the account lockout, like the web sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
            example: { email: "anna@beispiel-handwerk.de", password: "ein langer Satz als Passwort" }
      responses:
        "200":
          description: The secret to add to the authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileTotpEnrolment" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/auth/device-login:
    post:
      tags: [mobile-auth]
      operationId: deviceLogin
      summary: Sign in on a phone and register it (password and TOTP)
      description: |
        Checks email, password and a TOTP or recovery code (ADR 0017: every role uses 2FA), then
        registers the phone and returns an access token (15 minutes) and a refresh token.
        The workspace is the user's oldest membership that may use the app (OWNER, MEMBER or
        TECHNICIAN); tax advisors don't use the app (`403 APP_NOT_FOR_ROLE`).

        Errors: `401 INVALID_CREDENTIALS`, `401 TOTP_REQUIRED` (password right, code missing),
        `409 TOTP_ENROLMENT_REQUIRED` (no 2FA yet: call `totp-enrolment` first),
        `401 INVALID_CODE`, `403 EMAIL_NOT_VERIFIED`, `426 APP_UPDATE_REQUIRED`, `429 RATE_LIMITED`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceLogin" }
            example:
              email: "anna@beispiel-handwerk.de"
              password: "ein langer Satz als Passwort"
              code: "123456"
              device: { name: "Pixel 7", platform: ANDROID, appVersion: "0.2.0" }
      responses:
        "200":
          description: Signed in; the device is registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/auth/refresh:
    post:
      tags: [mobile-auth]
      operationId: refreshDeviceTokens
      summary: Exchange the refresh token for new tokens (rotation)
      description: |
        Each refresh token works once and is replaced by a new one. Presenting a used refresh
        token again revokes the device (`401 DEVICE_REVOKED`), because it means the token was
        copied. The app must therefore never run two refreshes at the same time.

        `401 REFRESH_TOKEN_INVALID`: unknown or expired; the app asks for a new sign-in and
        keeps its local data. `401 DEVICE_REVOKED`: the app deletes its local data.
      security: []
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
            example: { refreshToken: "q8N0c3J5bW9hZ2V0b2tlbmV4YW1wbGVfX19fX19fX18" }
      responses:
        "200":
          description: New tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokens" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/auth/logout:
    post:
      tags: [mobile-auth]
      operationId: deviceLogout
      summary: Sign this phone out (revokes the device)
      description: The device's tokens stop working at once. The app deletes its local data.
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/devices/me/status:
    get:
      tags: [mobile]
      operationId: getDeviceStatus
      summary: Who this device belongs to, and whether the app may continue
      description: |
        The app calls this on start and when it returns to the foreground. A revoked device
        gets `401 DEVICE_REVOKED` (the app deletes its local data). `appUpdate: REQUIRED` or a
        protocol outside `protocol` means the app must be updated before it can sync; other
        token requests from such an app answer `426 APP_UPDATE_REQUIRED`.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: The device's status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/devices/me/push-token:
    put:
      tags: [mobile]
      operationId: setPushToken
      summary: Register the app's push token for "sync now" messages
      description: |
        The server sends data-only messages without personal data (`{"type": "sync"}`) when
        something in the workspace changed (ADR 0038). The token is deleted with the device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushToken" }
            example: { token: "fcm-registration-token-from-the-app" }
      responses:
        "204": { description: Saved. }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/devices/me/telemetry:
    put:
      tags: [mobile]
      operationId: putTelemetry
      summary: Content-free counters of this device, per day (MARA Stage 9 field test)
      description: |
        How syncs and photo uploads ended on this phone, counted per day (Europe/Berlin): no
        record IDs, names or texts. The app sends the last days again from time to time; a day
        replaces what the server has for this device and day, so a resend changes nothing. The
        server keeps 180 days. Crashes go to GlitchTip, not here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryReport" }
            example:
              days:
                - day: "2027-05-10"
                  counters: { syncDone: 41, syncOffline: 6, syncFailed: 0, pushApplied: 88, pushConflict: 1, uploadDone: 12, uploadChunkRetries: 3, outboxMax: 14 }
      responses:
        "204": { description: Saved. }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/sync/push:
    post:
      tags: [mobile-sync]
      operationId: syncPush
      summary: Send the outbox (up to 200 mutations, in order)
      description: |
        Each mutation is applied in its own savepoint. A mutation ID that was applied before
        (within 30 days) gets its stored result again and changes nothing, so a resend after a
        timeout is safe.

        Updates carry the version of each changed field as the phone saw it (`baseVersions`).
        A field the server changed since then is a conflict, decided by the field's rule:
        planning fields of work orders keep the server value (office wins); status and work
        notes take the phone's value (technician wins); customer data takes the later write
        with a note to the office.

        Earlier mutations of the same push count as seen: a record created and then changed
        or deleted in one push (or in a resend) is no conflict.

        Deletes (MARA Stage 5: time entries, material lines, Aufmaß positions) carry the
        versions of all fields the phone knows. A delete loses against a concurrent edit: if
        another device changed the record meanwhile, it stays (`CONFLICT`, field `deleted`,
        winner `SERVER`, with the record). An edit of a record deleted after the phone last
        saw it brings it back (`CONFLICT`, field `deleted`, winner `DEVICE`). Deleting a
        record that is already gone is `APPLIED`.

        A workspace whose MARA add-on is read-only (trial over or cancelled, MARA Stage 10)
        gets 403 `MARA_READ_ONLY` (`MARA_NOT_BOOKED` if it was never started) for the whole push
        and nothing is applied; pulling still works. The phone keeps its outbox until the add-on
        is booked again.

        A `CREATE` of a record that already exists (e.g. a report or checklist answer whose
        ID two phones derived alike, `mara-rules/vectors/ids/`) is merged like an update made
        without seeing the record.

        Results:
        - `APPLIED`: `record` is the server's current record (none after a delete);
        - `CONFLICT`: some fields were decided against one side; `conflicts` lists them and
          `record` is the server's current record;
        - `REJECTED`: a rule was broken (`code`, e.g. `WORK_ORDER_LOCKED`, `NOT_IN_SCOPE`,
          `FIELD_NOT_ALLOWED`); nothing changed and the phone reverts its change.

        `426 PROTOCOL_UNSUPPORTED` when `protocolVersion` is outside the supported range.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
            example:
              protocolVersion: 1
              mutations:
                - mutationId: "0193a5f0-7d2c-7b4e-9a10-2c4d5e6f7a8b"
                  entity: work_order
                  entityId: "0193a5f0-11aa-7c3d-8e9f-0a1b2c3d4e5f"
                  op: UPDATE
                  values: { status: IN_PROGRESS }
                  baseVersions: { status: 41 }
      responses:
        "200":
          description: One result per mutation, in order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResult" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/sync/pull:
    get:
      tags: [mobile-sync]
      operationId: syncPull
      summary: Changes since the cursor (up to 500 records), within the user's scope
      description: |
        Records are the current state, in change order. A record that left the user's scope
        (e.g. a work order assigned to someone else) arrives as a removal. Start with no
        cursor; repeat with `nextCursor` while `hasMore`. The phone keeps its own pending
        changes on top until their push result arrives.
      parameters:
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` of the previous pull; empty for the first."
          schema: { type: string, maxLength: 40, pattern: "^[0-9]*$" }
        - name: protocolVersion
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 1 }
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullResult" }
        default: { $ref: "#/components/responses/Problem" }
  /mobile/uploads/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/PhotoId"
    head:
      tags: [mobile-uploads]
      operationId: headPhotoUpload
      summary: How much of a photo's file the server has (tus core protocol)
      description: |
        The photo record comes first, through sync (`photo` with `sizeBytes` and `sha256`), so
        the upload URL is known and needs no creation request. This answers the offset to
        resume from. Once the file is complete (state other than `PENDING_FILE`),
        `Upload-Offset` equals `Upload-Length`. 404 for a photo the app's user can't see or
        that hasn't been synced yet.
      parameters:
        - $ref: "#/components/parameters/TusResumable"
      responses:
        "200":
          description: The upload's state.
          headers:
            Tus-Resumable: { schema: { type: string, examples: ["1.0.0"] } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Cache-Control: { schema: { type: string, examples: ["no-store"] } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [mobile-uploads]
      operationId: patchPhotoUpload
      summary: Append a chunk to a photo's file (tus core protocol)
      description: |
        The app sends the file in chunks of about 1 MB (at most 2 MB), each starting at the
        current `Upload-Offset`. Answers:
        - `204` with the new `Upload-Offset`;
        - `409 UPLOAD_OFFSET_MISMATCH` when `Upload-Offset` isn't the server's offset (the app
          asks with `HEAD` and resumes from there);
        - `460 CHECKSUM_MISMATCH` when the complete file's SHA-256 differs from the photo
          record's `sha256`: the parts are discarded, the offset is 0 again and the app uploads
          the file again;
        - `413 UPLOAD_TOO_LARGE` for a chunk over 2 MB or past `sizeBytes`.

        When the last chunk arrives and the hash matches, the photo's state becomes `UPLOADED`
        and a worker job scans it for viruses (fail closed), checks that it is a JPEG image and
        makes a thumbnail; then the state is `STORED` (or `REJECTED`), and the phones learn it
        through sync. Sending a chunk of a complete upload changes nothing (`204`).
      parameters:
        - $ref: "#/components/parameters/TusResumable"
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0, examples: [0] }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Appended.
          headers:
            Tus-Resumable: { schema: { type: string } }
            Upload-Offset: { schema: { type: integer, format: int64 } }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Access token of a registered device (15 minutes; renewed with the refresh token, ADR 0037).
  parameters:
    PhotoId:
      name: photoId
      in: path
      required: true
      description: The photo record's ID (made on the phone, UUIDv7).
      schema: { type: string, format: uuid }
    TusResumable:
      name: Tus-Resumable
      in: header
      required: true
      description: The tus protocol version; only `1.0.0` is supported (412 otherwise).
      schema: { type: string, maxLength: 10, examples: ["1.0.0"] }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: The app's version, e.g. `0.1.0`.
      schema: { type: string, maxLength: 40, examples: ["0.1.0"] }
  responses:
    Problem:
      description: Error (RFC 9457 problem details).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    MobileStatus:
      type: object
      required: [protocol, minAppVersion, recommendedAppVersion, appUpdate, serverTime]
      properties:
        protocol: { $ref: "#/components/schemas/ProtocolVersions" }
        minAppVersion:
          type: string
          description: Older apps must update before they can sync.
          examples: ["0.1.0"]
        recommendedAppVersion:
          type: string
          description: Older apps are asked to update, but keep working.
          examples: ["0.1.0"]
        appUpdate: { $ref: "#/components/schemas/AppUpdate" }
        serverTime:
          type: string
          format: date-time
          description: The server's clock, for the app's clock-skew check.
    ProtocolVersions:
      type: object
      description: Sync protocol versions the server accepts (ADR 0038).
      required: [current, minimum]
      properties:
        current: { type: integer, format: int32, minimum: 1 }
        minimum: { type: integer, format: int32, minimum: 1 }
    AppUpdate:
      type: string
      enum: [NONE, RECOMMENDED, REQUIRED]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1000 }
    MobileTotpEnrolment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32, for typing into the authenticator app.
        otpauthUri:
          type: string
          description: "`otpauth://` link that opens the authenticator app on the same phone."
    DevicePlatform:
      type: string
      enum: [ANDROID, IOS]
    DeviceInfo:
      type: object
      required: [name, platform, appVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Shown to the owner in the device list, e.g. the phone model.
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        appVersion: { type: string, maxLength: 40 }
    DeviceLogin:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1000 }
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: Code from the authenticator app. Send either this or `recoveryCode`.
        recoveryCode: { type: string, maxLength: 40 }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    DeviceTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: "Send as `Authorization: Bearer`. Valid 15 minutes."
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken:
          type: string
          description: Works once; keep it in the platform keystore.
        refreshTokenExpiresAt: { type: string, format: date-time }
    MobileRole:
      type: string
      enum: [OWNER, MEMBER, TECHNICIAN]
    DeviceUser:
      type: object
      required: [userId, displayName, role, workspaceName]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/MobileRole" }
        workspaceName: { type: string }
    DeviceSession:
      type: object
      required: [deviceId, tokens, user]
      properties:
        deviceId: { type: string, format: uuid }
        tokens: { $ref: "#/components/schemas/DeviceTokens" }
        user: { $ref: "#/components/schemas/DeviceUser" }
        recoveryCodes:
          type: array
          description: Only when this sign-in confirmed the 2FA set-up. Shown once.
          items: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200 }
    DeviceStatus:
      type: object
      required: [deviceId, user, protocol, minAppVersion, appUpdate, serverTime]
      properties:
        deviceId: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/DeviceUser" }
        protocol: { $ref: "#/components/schemas/ProtocolVersions" }
        minAppVersion: { type: string }
        appUpdate: { $ref: "#/components/schemas/AppUpdate" }
        serverTime: { type: string, format: date-time }
    TelemetryReport:
      type: object
      required: [days]
      properties:
        days:
          type: array
          maxItems: 31
          items: { $ref: "#/components/schemas/TelemetryDay" }
    TelemetryDay:
      type: object
      required: [day, counters]
      properties:
        day: { type: string, format: date }
        counters: { $ref: "#/components/schemas/TelemetryCounters" }
    TelemetryCounters:
      type: object
      description: Missing counters are 0.
      properties:
        syncDone: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Sync runs that ended with everything sent and pulled" }
        syncOffline: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Sync runs stopped by a missing connection (nothing lost)" }
        syncReadOnly: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Sync runs whose changes the server refused because MARA or ERIKA is read-only (kept on the phone)" }
        syncFailed: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Sync runs that failed otherwise (e.g. a server error)" }
        pushApplied: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Mutations the server applied" }
        pushConflict: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Mutations decided by a conflict rule" }
        pushRejected: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Mutations the server refused" }
        uploadDone: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Photo upload runs that finished" }
        uploadOffline: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Photo upload runs stopped by a missing connection" }
        uploadChunkRetries: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Chunks sent again after an offset mismatch" }
        uploadRestarts: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "Photo files sent again from the start (hash refused)" }
        outboxMax: { type: integer, format: int32, minimum: 0, maximum: 10000000, description: "The longest outbox of the day (changes waiting)" }
    PushToken:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096 }
    MutationOp:
      type: string
      enum: [CREATE, UPDATE, DELETE]
    Mutation:
      type: object
      required: [mutationId, entity, entityId, op, values]
      properties:
        mutationId:
          type: string
          format: uuid
          description: Made on the phone (UUIDv7) when the change was saved; the same on every resend.
        entity: { type: string, maxLength: 40, examples: [work_order] }
        entityId: { type: string, format: uuid }
        op: { $ref: "#/components/schemas/MutationOp" }
        values:
          type: object
          # Any JSON values, null included (the app clears a field by sending null); typed as a
          # plain object so the generated model doesn't refuse null values.
          description: The changed fields (all fields for CREATE); null clears a field.
        baseVersions:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: |
            For UPDATE, the version of each changed field as the phone saw it; for DELETE, the
            versions of all fields the phone knows.
    PushRequest:
      type: object
      required: [protocolVersion, mutations]
      properties:
        protocolVersion: { type: integer, format: int32, minimum: 1 }
        mutations:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Mutation" }
    MutationStatus:
      type: string
      enum: [APPLIED, CONFLICT, REJECTED]
    ConflictWinner:
      type: string
      enum: [SERVER, DEVICE]
    FieldConflict:
      type: object
      required: [field, winner]
      properties:
        field: { type: string }
        serverValue: { description: The server's value before this mutation (any JSON value). }
        deviceValue: { description: The phone's value (any JSON value). }
        winner: { $ref: "#/components/schemas/ConflictWinner" }
    SyncRecord:
      type: object
      required: [entity, id, version, fieldVersions, data]
      properties:
        entity: { type: string }
        id: { type: string, format: uuid }
        version:
          type: integer
          format: int64
          description: Sequence number of the record's last change.
        fieldVersions:
          type: object
          additionalProperties: { type: integer, format: int64 }
        data:
          type: object
          additionalProperties: true
    MutationResult:
      type: object
      required: [mutationId, status]
      properties:
        mutationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MutationStatus" }
        record: { $ref: "#/components/schemas/SyncRecord" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/FieldConflict" }
        code: { type: string }
    PushResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MutationResult" }
    SyncRemoval:
      type: object
      required: [entity, id]
      properties:
        entity: { type: string }
        id: { type: string, format: uuid }
    PullResult:
      type: object
      required: [records, removals, nextCursor, hasMore]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/SyncRecord" }
        removals:
          type: array
          items: { $ref: "#/components/schemas/SyncRemoval" }
        nextCursor: { type: string }
        hasMore: { type: boolean }
    Problem:
      type: object
      description: RFC 9457 problem details with ERIKA's stable error code.
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, format: int32 }
        detail: { type: string }
        code: { type: string }
