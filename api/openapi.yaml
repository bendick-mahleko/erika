      type: object
      required: [id, version, state]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        state: { $ref: "#/components/schemas/ReportState" }
        signedAt: { type: string, format: date-time }
    OverdueInvoice:
      type: object
      required: [invoiceId, number, buyerName, issueDate, dueDate, gross, daysOverdue, reminders]
      properties:
        invoiceId: { type: string, format: uuid }
        number: { type: string }
        buyerName: { type: string }
        buyerEmail: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        gross: { type: string }
        daysOverdue: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        reminders:
          type: array
