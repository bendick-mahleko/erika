        contactEmail: { type: string, maxLength: 320, description: "BT-43 and the seller's electronic address (BT-34)" }
        legalRegistration: { type: string, maxLength: 200, description: "BT-30, e.g. HRB 12345, Amtsgericht Berlin" }
