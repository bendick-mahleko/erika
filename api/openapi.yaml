      type: string
      enum: [OPEN, COMPLETED, SIGNED, NOT_SIGNED]
      description: |
        COMPLETED once the technician finished the report (mandatory checklist items answered, no
        timer running); SIGNED by the customer, or NOT_SIGNED (sent without a signature, with a
        reason). Signed and unsigned-sent versions never change; corrections are a new version.
