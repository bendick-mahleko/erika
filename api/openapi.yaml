openapi: 3.1.0
info:
  title: ERIKA API
  version: 0.14.0
  summary: E-Rechnung Inbox & Creator
  description: |
    Contract for the ERIKA back end. This file is the source of truth:
    the Kotlin server interfaces and the TypeScript client are generated from it.

    Conventions (Software Design §6):
    - Base path `/api/v1`, JSON, UTF-8, ISO 8601 dates.
    - Money as decimal strings ("1234.50") plus a currency code.
    - The workspace comes from the session, never from the URL.
    - Errors are RFC 9457 problem details with a stable `code`.
    - `Idempotency-Key` header on POST requests that create or send something.

    Authentication (Software Design §7): server-side session cookie `ERIKA_SESSION`
    after password **and** second factor (TOTP). State-changing requests need the
    CSRF token: read the `XSRF-TOKEN` cookie (set by `GET /auth/session`) and send it
    in the `X-XSRF-TOKEN` header.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: system
    description: Operational endpoints
  - name: auth
    description: Sign-up, sign-in with 2FA, sign-out (EX-02, NF-02)
  - name: workspace
    description: The signed-in user's workspace (from the session, never from the URL)
  - name: members
    description: Users of the workspace and their roles
  - name: notifications
    description: The signed-in user's notification preferences
  - name: intake
    description: Receiving files by upload and email (IN-01, IN-02, IN-05, NF-04)
  - name: documents
    description: Received documents, the viewer, status, tags and search (IN-04, IN-05, VW-01..06, AR-01..04)
  - name: feedback
    description: Feedback from users to the ERIKA team (closed beta)
  - name: invoices
    description: Creating, issuing and sending outgoing invoices, credit notes and cancellations (CR-01..07)
  - name: customers
    description: Customer list for the invoice creator (CR-05)
  - name: articles
    description: Articles and services for the invoice creator (CR-05)
  - name: workorders
    description: MARA job reports add-on - sites, staff levels, checklist templates and work orders (ADR 0036)
  - name: sync
    description: Notes on concurrent changes from the MARA app (ADR 0038)
  - name: reports
    description: Job reports recorded in the MARA app (MARA Stage 5), read-only in the office
  - name: photos
    description: Photos of job reports from the MARA app (MARA Stage 6), read-only in the office
  - name: report-invoicing
    description: Invoices from signed MARA reports (MARA Stage 8), issued through the invoice creator
  - name: report-verification
    description: Public check of a signed job report by its code (MARA Stage 7); hash and status only
  - name: devices
    description: Phones signed in to the MARA app; the owner can revoke them (ADR 0037)
  - name: invitations
    description: Inviting team members and the tax advisor (EX-02)
  - name: exports
    description: Period export with DATEV CSV and full account export (EX-01, EX-04)
  - name: billing
    description: Trial, Stripe subscription and ERIKA's own invoices (EX-03)
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health
      description: |
        Reports whether the API can reach its database and object storage and
        whether the background worker is alive. Returns 503 when the service
        can't serve requests.
      security: []
      responses:
        "200":
          description: The service is up (possibly degraded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The service is down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current sign-in state
      description: Also sets the `XSRF-TOKEN` cookie needed for state-changing requests.
      security: []
      responses:
        "200":
          description: Sign-in state of this browser session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/signup-policy:
    get:
      tags: [auth]
      operationId: getSignupPolicy
      summary: Whether sign-up needs an invitation, and the current terms version
      description: |
        During the closed beta (ADR 0030) sign-up needs a personal invitation link. The
        sign-up form uses this to explain that instead of showing a form that will fail.
      security: []
      responses:
        "200":
          description: The sign-up rules of this installation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupPolicy" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and its workspace
      description: |
        Creates the user (role OWNER) and the workspace and sends a verification email.
        Always answers 202, also when the email address is already registered (that
        address gets a notice instead), so the endpoint doesn't reveal accounts.

        The user must accept the terms, including the data-processing agreement
        (`termsAccepted: true`, else 400 `TERMS_NOT_ACCEPTED`); the accepted version is
        recorded and audited. While sign-up is invite-only, `invitationCode` must be a
        valid, unexpired invitation for exactly this email address (else 403
        `INVITATION_REQUIRED` or `INVITATION_INVALID`).

        With `workspaceInvitation` (the token from a workspace invitation email) the user joins
        the inviting workspace with the invited role instead of creating a workspace of their
        own; `workspaceName` is then not needed, the email address must be the invited one, and
        the invitation also counts as the closed-beta invitation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
            example: { email: "erika@example.de", password: "correct horse battery staple", displayName: "Erika Mustermann", workspaceName: "Mustermann Malerbetrieb", locale: "de", termsAccepted: true }
      responses:
        "202": { description: Accepted; check your email. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
            example: { token: "q3J1cHRvZ3JhcGhpY2FsbHktcmFuZG9tLXRva2Vu" }
      responses:
        "204": { description: Email address verified. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: First step of sign-in (email and password)
      description: |
        On success the session waits for the second factor: state `TOTP_REQUIRED`, or
        `TOTP_ENROLMENT_REQUIRED` if the user has not set up an authenticator app yet.
        Wrong credentials, unknown users and locked accounts all answer 401
        `INVALID_CREDENTIALS`. Five failures lock the account for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: "erika@example.de", password: "correct horse battery staple" }
      responses:
        "200":
          description: Password accepted; second factor needed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp:
    post:
      tags: [auth]
      operationId: verifyTotp
      summary: Second step of sign-in (authenticator code or recovery code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpRequest" }
            example: { code: "123456" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp/enrolment:
    post:
      tags: [auth]
      operationId: startTotpEnrolment
      summary: Start setting up the authenticator app
      description: Only after the password step, while the state is `TOTP_ENROLMENT_REQUIRED`.
      security: []
      responses:
        "200":
          description: Secret to scan as a QR code (otpauth URI) or type in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp/enrolment/confirm:
    post:
      tags: [auth]
      operationId: confirmTotpEnrolment
      summary: Finish setting up the authenticator app
      description: |
        Checks the first code from the app, turns 2FA on, signs the user in and returns
        ten single-use recovery codes. They are shown only this once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
            example: { code: "123456" }
      responses:
        "200":
          description: 2FA enabled and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: Sign out (ends the server-side session)
      security: []
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/invitation:
    post:
      tags: [auth]
      operationId: previewInvitation
      summary: What a workspace invitation link is for (before signing in or up)
      description: |
        The token is the only key, so this works without a session. 404
        `INVITATION_INVALID` for unknown tokens; expired, used or revoked invitations are
        returned with that `state`, so the page can explain it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
            example: { token: "q3J1cHRvZ3JhcGhpY2FsbHktcmFuZG9tLXRva2Vu" }
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/invitation/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Join the inviting workspace with the signed-in account
      description: |
        The signed-in user's email address must be the invited one (403
        `INVITATION_OTHER_ACCOUNT`). Afterwards the session is switched to the joined workspace.
        Accepting twice is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationTokenRequest" }
            example: { token: "q3J1cHRvZ3JhcGhpY2FsbHktcmFuZG9tLXRva2Vu" }
      responses:
        "200":
          description: The session, now in the joined workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/workspace:
    post:
      tags: [auth]
      operationId: switchWorkspace
      summary: Continue in another workspace the user belongs to
      description: |
        E.g. a tax advisor with several clients. The session gets a new ID and the role of
        that membership; 404 `WORKSPACE_NOT_FOUND` if the user isn't a member.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchWorkspaceRequest" }
            example: { workspaceId: "3f1c0a52-8d55-4b8e-a2c0-6d1f0b7e9a11" }
      responses:
        "200":
          description: The session in the chosen workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Send a link to set a new password
      description: |
        Always answers 202, whether or not the address belongs to an account (no account
        enumeration). The link is valid for one hour and works once. The second factor stays as it
        is: signing in afterwards still needs the authenticator app or a recovery code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
            example: { email: "erika@example.de" }
      responses:
        "202": { description: "If the address has an account, a link is on its way." }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the email
      description: |
        Ends every session of the user. 400 `INVALID_TOKEN` for an unknown, used or expired
        token; 400 `WEAK_PASSWORD` or `PASSWORD_BREACHED` for a password that is too weak or
        appears in known data breaches.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirm" }
            example: { token: "q3J1cHRvZ3JhcGhpY2FsbHktcmFuZG9tLXRva2Vu", password: "ein neuer langer Satz als Passwort" }
      responses:
        "204": { description: "Password changed; sign in again." }
        default: { $ref: "#/components/responses/Problem" }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: |
        Needs the current password (400 `CURRENT_PASSWORD_WRONG`). Every other session of the user
        ends; this one stays signed in. Open to every role: it changes the user's own account,
        not workspace data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
            example: { currentPassword: "correct horse battery staple", newPassword: "ein neuer langer Satz als Passwort" }
      responses:
        "204": { description: Changed. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/locale:
    post:
      tags: [auth]
      operationId: changeLocale
      summary: Set the signed-in user's language (emails and the default for the app)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocaleChange" }
            example: { locale: "en" }
      responses:
        "204": { description: Saved. }
        default: { $ref: "#/components/responses/Problem" }
  /workspace:
    get:
      tags: [workspace]
      operationId: getWorkspace
      summary: Workspace settings
      responses:
        "200":
          description: The workspace of the session.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Change workspace settings (owner only)
      description: Needs `If-Match` with the ETag from `GET /workspace` (optimistic locking).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdate" }
            example: { name: "Mustermann Malerbetrieb", street: "Musterstraße 1", postalCode: "10115", city: "Berlin", countryCode: "DE", vatId: "DE123456789", taxNumber: "30/123/45678" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
  /workspace/closure:
    post:
      tags: [workspace]
      operationId: closeWorkspace
      summary: Close the account (owner only, EX-04)
      description: |
        The workspace becomes read-only for everyone: members can still sign in, read, download
        and export, but nothing can be changed, and its intake address stops accepting mail.
        The data is kept until the last retention date of its originals (`deleteAfter`) and
        deleted afterwards. Billing ends with the closure. Recorded in the audit log; can't be
        undone in the app. `confirmName` must repeat the workspace name exactly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceClosureRequest" }
            example: { confirmName: "Name des Arbeitsbereichs" }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Users of the workspace
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /members/{memberId}:
    get:
      tags: [members]
      operationId: getMember
      summary: One member of the workspace
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [members]
      operationId: changeMemberRole
      summary: Change a member's role (owner only)
      description: The last owner can't be demoted (409 `LAST_OWNER`). The member signs in again with the new role.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRoleChange" }
            example: { role: "ADVISOR" }
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member from the workspace (owner only)
      description: |
        The user's account stays (they may belong to other workspaces); their sessions in this
        workspace end with their next request. The last owner can't be removed (409 `LAST_OWNER`).
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /invitations:
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: Open and recent invitations (owner only)
      responses:
        "200":
          description: Invitations, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite someone by email as MEMBER or ADVISOR (owner only)
      description: |
        Sends an email with a link that is valid for 7 days. A new invitation to the same
        address replaces the open one. 409 `ALREADY_MEMBER` if the address already belongs to a
        member. Tax advisors (ADVISOR) can read, comment and export, but never change data.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationRequest" }
            example: { email: "kanzlei@steuerberater.example", role: "ADVISOR" }
      responses:
        "201":
          description: Invitation sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Problem" }
  /invitations/{invitationId}:
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Withdraw an open invitation (owner only)
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204": { description: Withdrawn (or no longer open). }
        default: { $ref: "#/components/responses/Problem" }
  /notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The signed-in user's notification preferences in this workspace
      responses:
        "200":
          description: Current preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Change the signed-in user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
            example: { emailOnNewDocuments: true }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/address:
    get:
      tags: [intake]
      operationId: getIntakeAddress
      summary: The workspace's email address for incoming invoices (IN-01)
      description: Suppliers send invoices to this address; attachments (XML, PDF, ZIP) are imported automatically.
      responses:
        "200":
          description: The intake address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeAddress" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/settings:
    get:
      tags: [intake]
      operationId: getIntakeSettings
      summary: Sender allow-list for email intake (IN-06)
      responses:
        "200":
          description: The settings and the allowed senders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [intake]
      operationId: updateIntakeSettings
      summary: Switch the allow-list on or off
      description: |
        With the allow-list on, emails from other senders are kept in quarantine: they are
        archived as received, but their attachments are imported only when someone releases
        them. A sender matches by the envelope sender or the From address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeSettingsUpdate" }
            example: { allowListEnabled: true }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/senders:
    post:
      tags: [intake]
      operationId: addIntakeSender
      summary: Allow a sender address or domain
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeSenderRequest" }
            example: { pattern: "@lieferant.example" }
      responses:
        "201":
          description: Allowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeSender" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/senders/{senderId}:
    delete:
      tags: [intake]
      operationId: removeIntakeSender
      summary: Remove a sender from the allow-list
      parameters:
        - $ref: "#/components/parameters/SenderId"
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /intake/quarantine:
    get:
      tags: [intake]
      operationId: listQuarantine
      summary: Emails held back because their sender is not allowed
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuarantineList" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/quarantine/{intakeId}/release:
    post:
      tags: [intake]
      operationId: releaseQuarantinedMail
      summary: Import the attachments of a quarantined email
      description: With `allowSender`, the sender's address is also added to the allow-list.
      parameters:
        - $ref: "#/components/parameters/IntakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuarantineRelease" }
            example: { allowSender: true }
      responses:
        "202": { description: Being imported. }
        default: { $ref: "#/components/responses/Problem" }
  /intake/quarantine/{intakeId}/discard:
    post:
      tags: [intake]
      operationId: discardQuarantinedMail
      summary: Discard a quarantined email (nothing is imported; the received email stays archived)
      parameters:
        - $ref: "#/components/parameters/IntakeId"
      responses:
        "204": { description: Discarded. }
        default: { $ref: "#/components/responses/Problem" }
  /uploads:
    post:
      tags: [intake]
      operationId: createUpload
      summary: Start an upload (IN-02)
      description: |
        Announces one file (XML, PDF or ZIP, at most 20 MB) and returns a short-lived URL.
        The browser sends the file there with `PUT`, using exactly the returned headers,
        and then calls `POST /uploads/{uploadId}/complete`. The file is virus-scanned,
        unpacked if it is a ZIP, archived and validated in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
            example: { fileName: "rechnung-2026-0815.xml", size: 24576, contentType: "application/xml" }
      responses:
        "201":
          description: Upload started; send the file to `uploadUrl`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /uploads/{uploadId}:
    get:
      tags: [intake]
      operationId: getUpload
      summary: State and result of an upload
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The upload with one item per file found in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /uploads/{uploadId}/complete:
    post:
      tags: [intake]
      operationId: completeUpload
      summary: Confirm that the file has been sent
      description: |
        Checks that the file arrived with the announced size and queues it for processing.
        Calling it again for an upload that is already being processed returns its state.
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "202":
          description: The file is queued for processing; poll `GET /uploads/{uploadId}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /inbox/summary:
    get:
      tags: [documents]
      operationId: getInboxSummary
      summary: Counts for the in-app badge
      responses:
        "200":
          description: Number of new documents and of documents still being processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents of the workspace, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` from the previous page."
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [IN, OUT]
        - name: from
          in: query
          required: false
          description: Invoice date (BT-2) from this day; documents without one count by their receipt date.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Invoice date (BT-2) up to this day, inclusive.
          schema: { type: string, format: date }
        - name: q
          in: query
          required: false
          description: |
            Search text (AR-04): German full-text search over supplier, buyer, invoice number,
            item names and notes, plus fuzzy matching of supplier names and the file name.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
      responses:
        "200":
          description: One page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: One document with its invoice data, latest validation result and status history
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Change status, tags or note (metadata only; the original never changes)
      description: |
        A status change is recorded in the history with user, time and the optional
        `statusNote` (AR-03), and audited (AR-02). Fields that are absent stay as they are.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
            example: { status: "CHECKED", statusNote: "Rechnung geprüft, Betrag stimmt", tags: ["Material"] }
      responses:
        "200":
          description: The changed document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/status:
    post:
      tags: [documents]
      operationId: changeDocumentStatus
      summary: Set the status of several documents at once
      description: Each changed document gets its own history entry and audit entry. Unknown IDs are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkStatusChange" }
            example: { documentIds: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"], status: "APPROVED", note: "Freigegeben" }
      responses:
        "200":
          description: How many documents changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkStatusResult" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/comments:
    get:
      tags: [documents]
      operationId: listDocumentComments
      summary: Comments on a document, oldest first
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The comments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [documents]
      operationId: addDocumentComment
      summary: Comment on a document (every role, tax advisors included)
      description: Comments can't be edited or deleted; the original document never changes.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentRequest" }
            example: { body: "Bitte Leistungszeitraum ergänzen lassen." }
      responses:
        "201":
          description: The new comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/view:
    get:
      tags: [documents]
      operationId: getDocumentView
      summary: The invoice for reading, every business term with its label (VW-01, VW-07)
      description: |
        404 `VIEW_NOT_AVAILABLE` for documents that aren't structured invoices or are still being
        read. With `lang=en` the English view; documents read before release 1.1 have only the
        German one until they are read again (`language` in the answer says which).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum: [de, en]
            default: de
      responses:
        "200":
          description: The invoice view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceView" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/view-pdf:
    get:
      tags: [documents]
      operationId: getDocumentViewPdf
      summary: PDF view copy, marked "Ansichtskopie – Original ist die XML-Datei" on every page (VW-02)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The PDF view copy.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/original:
    get:
      tags: [documents]
      operationId: getDocumentOriginal
      summary: The original file, unchanged (AR-01)
      description: |
        The SHA-256 is checked before the file is sent and returned in `Repr-Digest`
        (RFC 9530) and `Digest` (RFC 3230), so the recipient can verify it.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The original, as a download.
          headers:
            Repr-Digest:
              description: "`sha-256=:<base64>:`"
              schema: { type: string }
            Digest:
              description: "`sha-256=<base64>`"
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/attachments/{attachmentIndex}:
    get:
      tags: [documents]
      operationId: getDocumentAttachment
      summary: An attachment embedded in the invoice (BT-125), decoded, as a download (VW-06)
      description: Always sent as a download with a strict Content Security Policy, never shown inline.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: attachmentIndex
          in: path
          required: true
          description: "`index` from the view's `attachments`."
          schema: { type: integer, format: int32, minimum: 0, maximum: 999 }
      responses:
        "200":
          description: The attachment in its original format.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/revalidate:
    post:
      tags: [documents]
      operationId: revalidateDocument
      summary: Read and validate the document again with the current validation pack
      description: Adds a new validation result; earlier results stay in the history (BR-07).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Queued; the document shows processing PENDING until done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
  /feedback:
    post:
      tags: [feedback]
      operationId: sendFeedback
      summary: Send feedback to the ERIKA team (closed beta)
      description: |
        Stored and forwarded to the team by email. Every role may send feedback, tax
        advisors included: it doesn't change any workspace data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
            example: { category: "IDEA", message: "Eine Sortierung nach Fälligkeit wäre praktisch.", page: "/inbox" }
      responses:
        "202": { description: Received; thank you. }
        default: { $ref: "#/components/responses/Problem" }
  /invoice-settings:
    get:
      tags: [invoices]
      operationId: getInvoiceSettings
      summary: Seller data, numbering and defaults for creating invoices
      description: |
        The seller's name, address, VAT ID and tax number come from the workspace settings
        (`GET /workspace`) and are shown here read-only. `missing` lists what must be filled in
        before an invoice can be issued.
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [invoices]
      operationId: updateInvoiceSettings
      summary: Change the invoice settings (owner only)
      description: Needs `If-Match` with the ETag from `GET /invoice-settings`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSettingsUpdate" }
            example:
              contactName: "Erika Mustermann"
              contactPhone: "+49 30 1234567"
              contactEmail: "rechnung@mustermann.example"
              iban: "DE02120300000000202051"
              bic: "BYLADEM1001"
              accountHolder: "Mustermann Malerbetrieb GmbH"
              kleinunternehmer: false
              numberPattern: "RE-{YYYY}-{NNNN}"
              creditNotePattern: "GS-{YYYY}-{NNNN}"
              defaultFormat: "ZUGFERD_EN16931"
              paymentTermsDays: 14
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /invoice-settings/logo:
    get:
      tags: [invoices]
      operationId: getInvoiceLogo
      summary: The logo printed on ZUGFeRD invoices
      responses:
        "200":
          description: The image.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [invoices]
      operationId: uploadInvoiceLogo
      summary: Set the logo for ZUGFeRD invoices (owner only, CR-08)
      description: PNG or JPEG, at most 512 KB, as the form field `file`. It is printed top right on the first page; the invoice data doesn't change.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "204": { description: Saved. }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [invoices]
      operationId: deleteInvoiceLogo
      summary: Remove the logo (owner only)
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Problem" }
  /recurring-invoices:
    get:
      tags: [invoices]
      operationId: listRecurringInvoices
      summary: Recurring invoices (CR-09)
      responses:
        "200":
          description: All templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoiceList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [invoices]
      operationId: createRecurringInvoice
      summary: Make an invoice recur monthly or quarterly
      description: |
        Copies the content of the draft or invoice `sourceInvoiceId`. On every run date ERIKA
        creates a new draft from it, with the service period of that run (the month or quarter
        starting on the run date) and no invoice date, and tells the person who set it up.
        Drafts are never issued automatically.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInvoiceRequest" }
            example: { sourceInvoiceId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", name: "Wartungsvertrag Kunde AG", interval: "MONTHLY", nextRun: "2027-01-01" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }
        default: { $ref: "#/components/responses/Problem" }
  /recurring-invoices/{recurringId}:
    get:
      tags: [invoices]
      operationId: getRecurringInvoice
      summary: One recurring invoice
      parameters:
        - $ref: "#/components/parameters/RecurringId"
      responses:
        "200":
          description: The template.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [invoices]
      operationId: updateRecurringInvoice
      summary: Rename, change the interval or the next run, pause or resume
      parameters:
        - $ref: "#/components/parameters/RecurringId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringInvoiceUpdate" }
            example: { name: "Wartungsvertrag Kunde AG", interval: "QUARTERLY", nextRun: "2027-04-01", active: true }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringInvoice" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [invoices]
      operationId: deleteRecurringInvoice
      summary: Stop and delete a recurring invoice (drafts already created stay)
      parameters:
        - $ref: "#/components/parameters/RecurringId"
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Problem" }
  /customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Customers, by name (CR-05)
      parameters:
        - name: q
          in: query
          required: false
          description: Part of the name, customer number or email address.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Matching customers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Add a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
            example:
              name: "Kunde AG"
              customerNumber: "K-1001"
              street: "Kundenweg 2"
              postalCode: "80331"
              city: "München"
              countryCode: "DE"
              email: "eingang@kunde.example"
              buyerReference: "K-1001"
              vatTreatment: "DOMESTIC"
      responses:
        "201":
          description: Created (or, for a repeated Idempotency-Key, the customer created the first time).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default: { $ref: "#/components/responses/Problem" }
  /customers/{customerId}:
    get:
      tags: [customers]
      operationId: getCustomer
      summary: One customer
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Change or archive a customer
      description: Needs `If-Match`. Issued invoices keep the data they were issued with.
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
            example: { name: "Kunde AG", city: "München", postalCode: "80331", countryCode: "DE", vatTreatment: "DOMESTIC", archived: false }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        default: { $ref: "#/components/responses/Problem" }
  /articles:
    get:
      tags: [articles]
      operationId: listArticles
      summary: Articles and services, by name (CR-05)
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Matching articles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [articles]
      operationId: createArticle
      summary: Add an article or service
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
            example: { name: "Malerarbeiten", articleNumber: "L-01", unitCode: "HUR", netPrice: "55.00", vatRate: "STANDARD_19" }
      responses:
        "201":
          description: Created (or, for a repeated Idempotency-Key, the article created the first time).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        default: { $ref: "#/components/responses/Problem" }
  /articles/{articleId}:
    get:
      tags: [articles]
      operationId: getArticle
      summary: One article
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: The article.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [articles]
      operationId: updateArticle
      summary: Change or archive an article
      parameters:
        - $ref: "#/components/parameters/ArticleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArticleInput" }
            example: { name: "Malerarbeiten", unitCode: "HUR", netPrice: "58.00", vatRate: "STANDARD_19", archived: false }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        default: { $ref: "#/components/responses/Problem" }
  /sites:
    get:
      tags: [workorders]
      operationId: listSites
      summary: Job sites (MARA, M-OF-01), by customer and name
      parameters:
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Sites.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workorders]
      operationId: createSite
      summary: Add a job site for a customer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteInput" }
            example: { customerId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", name: "Wohnung 3.2", street: "Lindenauer Markt 9", postalCode: "04177", city: "Leipzig", countryCode: "DE" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
  /sites/{siteId}:
    get:
      tags: [workorders]
      operationId: getSite
      summary: One job site
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: The site.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workorders]
      operationId: updateSite
      summary: Change or archive a job site
      description: Needs `If-Match`. The customer of a site doesn't change.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteInput" }
            example: { customerId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", name: "Wohnung 3.2", city: "Leipzig", countryCode: "DE", archived: false }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
  /staff-levels:
    get:
      tags: [workorders]
      operationId: listStaffLevels
      summary: Staff levels with their hourly rates (M-OF-04)
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Staff levels by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLevelList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workorders]
      operationId: createStaffLevel
      summary: Add a staff level with its hourly rate (owner only)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffLevelInput" }
            example: { name: "Geselle", hourlyRate: "58.00" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLevel" }
        default: { $ref: "#/components/responses/Problem" }
  /staff-levels/{staffLevelId}:
    get:
      tags: [workorders]
      operationId: getStaffLevel
      summary: One staff level
      parameters:
        - $ref: "#/components/parameters/StaffLevelId"
      responses:
        "200":
          description: The staff level.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLevel" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workorders]
      operationId: updateStaffLevel
      summary: Change or archive a staff level (owner only)
      parameters:
        - $ref: "#/components/parameters/StaffLevelId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffLevelInput" }
            example: { name: "Geselle", hourlyRate: "60.00", archived: false }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffLevel" }
        default: { $ref: "#/components/responses/Problem" }
  /staff:
    get:
      tags: [workorders]
      operationId: listStaff
      summary: People who can be assigned to work orders (owners, members, technicians)
      responses:
        "200":
          description: Staff by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffList" }
        default: { $ref: "#/components/responses/Problem" }
  /staff/{memberId}:
    put:
      tags: [workorders]
      operationId: updateStaffSettings
      summary: Set a person's staff level and whether they see prices in the app (owner only)
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffSettings" }
            example: { staffLevelId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", canSeePrices: false }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        default: { $ref: "#/components/responses/Problem" }
  /sync-conflicts:
    get:
      tags: [sync]
      operationId: listSyncConflicts
      summary: Concurrent changes from the MARA app to one work order or customer
      description: |
        When the office and a phone changed the same field at the same time, the field's rule
        decided (work orders: the office wins planning fields, the technician wins status and
        work notes; customers: the later write wins). The other value is kept here, newest first.
      parameters:
        - name: entityId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConflictList" }
        default: { $ref: "#/components/responses/Problem" }
  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Phones signed in to the MARA app, per person (owner only)
      description: |
        Active devices first, then revoked ones (newest first). Tokens are never shown.
      responses:
        "200":
          description: The devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        default: { $ref: "#/components/responses/Problem" }
  /devices/{deviceId}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Lock a phone out of the MARA app (owner only)
      description: |
        The device's tokens stop working at once; on its next request the app gets
        `401 DEVICE_REVOKED` and deletes its local data (M-NF-07). Revoking an already revoked
        device changes nothing.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
  /checklist-templates:
    get:
      tags: [workorders]
      operationId: listChecklistTemplates
      summary: Checklist templates per job type (M-OF-05)
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Templates by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistTemplateList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workorders]
      operationId: createChecklistTemplate
      summary: Add a checklist template
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistTemplateInput" }
            example: { name: "Wartung Gasheizung", items: [{ key: "abgas", label: "Abgasmessung durchgeführt", kind: "YES_NO", required: true }, { key: "co", label: "CO-Wert (ppm)", kind: "VALUE", required: true }] }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistTemplate" }
        default: { $ref: "#/components/responses/Problem" }
  /checklist-templates/{checklistTemplateId}:
    get:
      tags: [workorders]
      operationId: getChecklistTemplate
      summary: One checklist template
      parameters:
        - $ref: "#/components/parameters/ChecklistTemplateId"
      responses:
        "200":
          description: The template.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistTemplate" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workorders]
      operationId: updateChecklistTemplate
      summary: Change or archive a checklist template
      description: Needs `If-Match`. Reports copy the items when they are created (Stage 5), so changes don't alter existing reports.
      parameters:
        - $ref: "#/components/parameters/ChecklistTemplateId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistTemplateInput" }
            example: { name: "Wartung Gasheizung", items: [{ key: "abgas", label: "Abgasmessung durchgeführt", kind: "YES_NO", required: true }], archived: false }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistTemplate" }
        default: { $ref: "#/components/responses/Problem" }
  /work-orders:
    get:
      tags: [workorders]
      operationId: listWorkOrders
      summary: Work orders (Aufträge), for the list and the calendar (M-OF-02, M-OF-03)
      description: |
        With `from` and `to`, only work orders whose planned time overlaps the range (calendar);
        unplanned ones are left out. Without them, all work orders: unplanned first, then by planned start.
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: assigneeId
          in: query
          required: false
          description: User ID of an assigned person.
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WorkOrderStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Work orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrderList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [workorders]
      operationId: createWorkOrder
      summary: Create a work order and assign it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderInput" }
            example: { customerId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", title: "Gastherme verliert Druck", description: "Kunde meldet Druckverlust seit Montag", plannedFrom: "2026-12-02T08:00:00+01:00", plannedTo: "2026-12-02T10:00:00+01:00", assigneeIds: [] }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        default: { $ref: "#/components/responses/Problem" }
  /work-orders/{workOrderId}:
    get:
      tags: [workorders]
      operationId: getWorkOrder
      summary: One work order
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      responses:
        "200":
          description: The work order.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workorders]
      operationId: updateWorkOrder
      summary: Change, reschedule, reassign or set the status of a work order
      description: |
        Needs `If-Match`. Users set PLANNED, IN_PROGRESS, DONE and CANCELLED; SIGNED and INVOICED
        are set by MARA when a report is signed or billed (409 `STATUS_NOT_ALLOWED`). A signed or
        invoiced work order doesn't change any more (409 `WORK_ORDER_LOCKED`). Status changes are audited.
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderInput" }
            example: { customerId: "7c9e6679-7425-40de-944b-e07fc1f90ae7", title: "Gastherme verliert Druck", status: "IN_PROGRESS", assigneeIds: [] }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        default: { $ref: "#/components/responses/Problem" }
  /work-orders/{workOrderId}/report:
    get:
      tags: [reports]
      operationId: getWorkOrderReport
      summary: The job report of a work order, as recorded in the MARA app (read-only)
      description: |
        Times, materials, Aufmaß, checklist and work description that the technicians recorded
        on site (M-MO-03 to M-MO-08). Times are the raw times as recorded; rounding happens only
        on the invoice (M-BR-04). The checklist lists every item of the work order's template,
        answered or not. Without a report yet, `report` is missing and the lists are empty.
      parameters:
        - $ref: "#/components/parameters/WorkOrderId"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrderReport" }
        default: { $ref: "#/components/responses/Problem" }
  /reports/{reportId}/pdf:
    get:
      tags: [reports]
      operationId: getReportPdf
      summary: The archived PDF of a signed (or unsigned-sent) report version, as a download
      description: |
        Rendered by the worker from the server's data after the signature and stored write-once
        (ADR 0040); hash-checked on every download. 404 while it isn't archived yet.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: The PDF, with attachment disposition.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /public/report-verifications/{code}:
    get:
      tags: [report-verification]
      operationId: getReportVerification
      summary: Whether a report with this verification code was signed, and its hash (no content)
      description: |
        The code is printed on the report PDF and in its QR code (M-MO-11). Without a session;
        never shows the report's content, only the firm, the status, the version, when it was
        signed and the SHA-256 of the canonical report. 404 for unknown codes.
      security: []
      parameters:
        - $ref: "#/components/parameters/VerificationCode"
      responses:
        "200":
          description: The verification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportVerification" }
        default: { $ref: "#/components/responses/Problem" }
  /public/report-verifications/{code}/pdf:
    get:
      tags: [report-verification]
      operationId: getVerifiedReportPdf
      summary: The report PDF for the customer, with the key from the QR code
      description: |
        The QR code on the report the customer got on site carries a download key; with it,
        the customer fetches the PDF later (M-MO-11). 404 for a wrong key or before the PDF is
        archived.
      security: []
      parameters:
        - $ref: "#/components/parameters/VerificationCode"
        - name: key
          in: query
          required: true
          schema: { type: string, minLength: 22, maxLength: 100, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        "200":
          description: The PDF, with attachment disposition.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /photos/{photoId}/thumbnail:
    get:
      tags: [photos]
      operationId: getPhotoThumbnail
      summary: A photo's thumbnail (JPEG, long side 400 px)
      description: Only for photos in state STORED (404 otherwise). Not cached by the browser.
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /photos/{photoId}/file:
    get:
      tags: [photos]
      operationId: getPhotoFile
      summary: A photo as taken (JPEG, long side up to 2,048 px), as a download
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: The image, with attachment disposition.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /invoices:
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: Outgoing invoices and drafts, newest first
      parameters:
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/InvoiceState" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [invoices]
      operationId: createInvoiceDraft
      summary: Start a new invoice (draft)
      description: |
        Creates a draft with the workspace defaults (format, payment terms). The draft is
        saved as it is edited (`PUT /invoices/{invoiceId}`) and issued with
        `POST /invoices/{invoiceId}/issue` (CR-01).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceContent" }
            example: { format: "ZUGFERD_EN16931", lines: [] }
      responses:
        "201":
          description: The new draft.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}:
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: One invoice or draft, with computed totals and open problems
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: The invoice.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [invoices]
      operationId: updateInvoiceDraft
      summary: Save a draft (autosave)
      description: |
        Replaces the draft's content; needs `If-Match` (412 if someone else saved in between).
        Only drafts can be changed: an issued invoice is corrected by a credit note (CR-06).
        Incomplete drafts are saved; `problems` says what is missing.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceContent" }
            example:
              format: "ZUGFERD_EN16931"
              buyer: { name: "Kunde AG", street: "Kundenweg 2", postalCode: "80331", city: "München", countryCode: "DE" }
              deliveryDate: "2026-11-20"
              lines: [{ name: "Malerarbeiten", quantity: "8", unitCode: "HUR", netPrice: "55.00", vatRate: "STANDARD_19" }]
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [invoices]
      operationId: deleteInvoiceDraft
      summary: Discard a draft
      description: Only drafts that were never issued. Issued invoices can't be deleted (GoBD).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "204": { description: Discarded. }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}/issue:
    post:
      tags: [invoices]
      operationId: issueInvoice
      summary: Issue the invoice (assign number, generate, validate, archive)
      description: |
        Refused with 422 `DRAFT_INCOMPLETE` while mandatory content is missing (CR-01). Otherwise
        the draft is frozen and issued in the background (Software Design §5, Flow C): one
        transaction assigns the next number, generates the file, validates it (must be VALID or
        WARNING; otherwise nothing is issued and the number is not used), archives it and creates
        the document. Poll `GET /invoices/{invoiceId}` until `state` is ISSUED, or back to DRAFT
        with `issueError`. Repeating the call is harmless.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Being issued (or already issued).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}/credit-note:
    post:
      tags: [invoices]
      operationId: createCreditNote
      summary: Start a credit note, cancellation or correction for an issued invoice (CR-06)
      description: |
        Creates a draft that references the original (BT-25), prefilled with its lines:
        CREDIT_NOTE (type 381, edit the lines to credit part of it), CANCELLATION (381 for the
        full amount; the original becomes CANCELLED when issued) or CORRECTION (384, the
        corrected invoice; the original becomes CANCELLED when issued).
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditNoteRequest" }
            example: { kind: "CANCELLATION" }
      responses:
        "201":
          description: The new draft.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/overdue:
    get:
      tags: [invoices]
      operationId: listOverdueInvoices
      summary: Issued invoices past their due date that aren't paid, booked or cancelled (M-IV-06)
      responses:
        "200":
          description: Oldest due first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverdueInvoiceList" }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}/reminders:
    post:
      tags: [invoices]
      operationId: sendInvoiceReminder
      summary: Email a payment reminder for an overdue invoice (M-IV-06)
      description: |
        The invoice is sent again with a reminder text: the first time as a Zahlungserinnerung,
        then as 1. and 2. Mahnung (at most three). Without `to`, the invoice's email address is
        used. 409 `INVOICE_NOT_OVERDUE` or `REMINDERS_EXHAUSTED`.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderRequest" }
            example: { to: "buchhaltung@kunde.example" }
      responses:
        "201":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderSent" }
        default: { $ref: "#/components/responses/Problem" }
  /report-invoicing/settings:
    get:
      tags: [report-invoicing]
      operationId: getReportInvoicingSettings
      summary: How the firm bills reports (billing unit, travel)
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportInvoicingSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [report-invoicing]
      operationId: updateReportInvoicingSettings
      summary: Change how the firm bills reports (owner only, M-BR-04, M-BR-05)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInvoicingSettings" }
            example: { billingUnitMinutes: 15, defaultHourlyRate: "58.00", travelMode: "FLAT", travelFlatAmount: "35.00" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportInvoicingSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /report-invoicing/customers/{customerId}:
    get:
      tags: [report-invoicing]
      operationId: getCustomerBillingSettings
      summary: A customer's own billing unit and travel settings (empty fields use the firm's)
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: The customer's settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBillingSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [report-invoicing]
      operationId: updateCustomerBillingSettings
      summary: Set a customer's own billing unit and travel settings (owner only)
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerBillingSettings" }
            example: { travelMode: "TIME", travelHourlyRate: "45.00" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerBillingSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /report-invoicing/billable:
    get:
      tags: [report-invoicing]
      operationId: listBillableReports
      summary: Signed (or unsigned-sent) reports not yet on an invoice, newest first
      description: The current version of each work order's report; optionally of one customer.
      parameters:
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillableReportList" }
        default: { $ref: "#/components/responses/Problem" }
  /report-invoicing/preview:
    post:
      tags: [report-invoicing]
      operationId: previewReportInvoice
      summary: Invoice lines from selected reports of one customer (M-IV-01, M-BR-04, M-BR-05)
      description: |
        Times are rounded up per entry to the billing unit and multiplied by the technician's
        hourly rate (staff level, else the firm's default); travel is a flat amount per visit or
        billed by time; materials use the article's net price (free-text materials need a price).
        Changes nothing. The office may change the lines before creating the invoice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSelection" }
            example: { reportIds: ["e44bdc67-2c88-88dc-a4ea-0e5a8e7a6154"] }
      responses:
        "200":
          description: The proposed lines.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportInvoicePreview" }
        default: { $ref: "#/components/responses/Problem" }
  /report-invoicing/invoices:
    post:
      tags: [report-invoicing]
      operationId: createReportInvoice
      summary: Create and issue the invoice for the selected reports (M-IV-01 to M-IV-04)
      description: |
        The invoice creator makes a draft with the customer's data, the (possibly changed) lines
        and the signed report PDFs embedded (BG-24), and issues it in the worker (number,
        e-invoice, validation, archive). A report can be on one invoice only (409
        `ALREADY_INVOICED`). Once issued, the work orders become INVOICED.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInvoiceRequest" }
            example:
              reportIds: ["e44bdc67-2c88-88dc-a4ea-0e5a8e7a6154"]
              lines:
                - { name: "Arbeitszeit Geselle", quantity: "1.25", unitCode: "HUR", netPrice: "58.00", vatRate: "STANDARD_19", laborCost: true }
              propertyRelated: true
      responses:
        "201":
          description: Created; issuing runs in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportInvoiceCreated" }
        default: { $ref: "#/components/responses/Problem" }
  /reports/time-entries.csv:
    get:
      tags: [reports]
      operationId: exportTimeEntries
      summary: Time entries as CSV for payroll (owner only, M-IV-07)
      description: Raw times as recorded (no rounding), one row per entry, semicolon-separated (German Excel).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: The CSV, as a download.
          content:
            text/csv:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}/send:
    post:
      tags: [invoices]
      operationId: sendInvoice
      summary: Send the issued invoice by email (CR-07)
      description: |
        Queues the email with the invoice file attached. The sent message is archived
        write-once together with the file; delivery results appear in `deliveries` and in the
        document's history.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendInvoiceRequest" }
            example: { to: "eingang@kunde.example", message: "Guten Tag, anbei unsere Rechnung. Viele Grüße" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceDelivery" }
        default: { $ref: "#/components/responses/Problem" }
  /invoices/{invoiceId}/deliveries/{deliveryId}/message:
    get:
      tags: [invoices]
      operationId: getInvoiceDeliveryMessage
      summary: The sent email as archived (.eml, with the invoice attached)
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - name: deliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The message (RFC 5322), as an attachment.
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /exports:
    get:
      tags: [exports]
      operationId: listExports
      summary: Exports of the workspace, newest first
      responses:
        "200":
          description: The exports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [exports]
      operationId: createExport
      summary: Start a period export (every role) or a full account export (owner only)
      description: |
        Built in the background. PERIOD: a ZIP with the originals whose invoice date (or receipt
        date, when there is none) lies in `from`…`to`, an index CSV (file name, SHA-256, invoice
        data) and a DATEV Buchungsstapel CSV (EXTF) per fiscal year (EX-01). FULL: every archived
        original plus all metadata and the audit log as JSON, with a SHA-256 manifest (EX-04,
        NF-09). The requester gets an email when it is ready; the ZIP can be downloaded after
        signing in until `expiresAt` (7 days), then it is deleted.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
            example: { kind: "PERIOD", from: "2026-10-01", to: "2026-12-31", scope: "ALL" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        default: { $ref: "#/components/responses/Problem" }
  /exports/{exportId}:
    get:
      tags: [exports]
      operationId: getExport
      summary: One export and its state
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        default: { $ref: "#/components/responses/Problem" }
  /exports/{exportId}/download:
    get:
      tags: [exports]
      operationId: downloadExport
      summary: Download the ZIP (signed-in users of the workspace only)
      description: |
        Redirects to a short-lived (60 s) download URL of the object store. 409
        `EXPORT_NOT_READY` while it is being built, 410 `EXPORT_EXPIRED` after `expiresAt`.
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "303":
          description: See the download URL.
          headers:
            Location:
              description: Short-lived download URL.
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /datev-settings:
    get:
      tags: [exports]
      operationId: getDatevSettings
      summary: Settings for the DATEV CSV (consultant and client number, chart of accounts)
      responses:
        "200":
          description: The settings (defaults until saved).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatevSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [exports]
      operationId: updateDatevSettings
      summary: Change the DATEV settings (owner only)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatevSettingsUpdate" }
            example: { consultantNumber: 1234567, clientNumber: 10001, chart: "SKR03", fiscalYearStartMonth: 1, accountLength: 4 }
      responses:
        "200":
          description: Saved.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatevSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /billing:
    get:
      tags: [billing]
      operationId: getBilling
      summary: Subscription and trial state of the workspace (EX-03)
      description: |
        `state` decides what the workspace may do: TRIAL and ACTIVE (and PAST_DUE while Stripe
        retries a payment) allow everything; READ_ONLY (trial over without a subscription, or
        the subscription unpaid or cancelled) allows reading, downloading, exporting and paying,
        but no changes (403 `SUBSCRIPTION_REQUIRED`). DISABLED: billing is switched off here.
      responses:
        "200":
          description: The billing state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/checkout:
    post:
      tags: [billing]
      operationId: startCheckout
      summary: Start a subscription with Stripe Checkout (owner only)
      description: |
        Answers with the URL of the Stripe payment page (card or SEPA Direct Debit). The
        remaining trial is kept: Stripe charges first when it ends. The result arrives by
        webhook. 409 `ALREADY_SUBSCRIBED` with a running subscription (use the portal).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
            example: { plan: "MONTHLY" }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectUrl" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/portal:
    post:
      tags: [billing]
      operationId: openBillingPortal
      summary: Open the Stripe customer portal (owner only)
      description: Change the payment method, switch plan, cancel. 409 `NO_SUBSCRIPTION` before the first checkout.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedirectUrl" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/addons/mara:
    get:
      tags: [billing]
      operationId: getMaraAddon
      summary: The MARA add-on of the workspace (trial, booking, seats; MARA Stage 10)
      description: |
        `state`: DISABLED (billing off here, or the add-on not offered yet: MARA is free), NONE
        (never started: MARA can be read but not used), TRIAL (30 days, free), ACTIVE (booked on
        the subscription), EXEMPT (free, e.g. beta firms), READ_ONLY (trial over, or cancelled:
        office and app data stay readable and exportable, but nothing new can be saved or
        synced, 403 `MARA_READ_ONLY`).
      responses:
        "200":
          description: The add-on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaraAddon" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/addons/mara/trial:
    post:
      tags: [billing]
      operationId: startMaraTrial
      summary: Start the free 30-day trial of the add-on (owner only, once)
      description: |
        The owner confirms the notice on the works council and the information for employees
        (M-BR-09). 409 `MARA_TRIAL_USED` if the trial ran before; 400
        `WORKS_COUNCIL_NOTICE_REQUIRED` without the confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaraTrialRequest" }
            example: { worksCouncilNoticeAccepted: true }
      responses:
        "200":
          description: The trial runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaraAddon" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/addons/mara/subscription:
    post:
      tags: [billing]
      operationId: bookMaraAddon
      summary: Add MARA to the running subscription (owner only)
      description: |
        Adds the add-on (€39 a month with 3 users included; more users as seats) to the running
        subscription; Stripe charges the rest of the period pro rata. The change is made by the
        worker; the state becomes ACTIVE once Stripe confirms. Without a subscription, book MARA
        with the plan in `POST /billing/checkout` (`addons`): 409 `SUBSCRIPTION_REQUIRED`.
        Booking ends a running trial. The owner must have confirmed the works-council notice
        (400 `WORKS_COUNCIL_NOTICE_REQUIRED`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaraTrialRequest" }
            example: { worksCouncilNoticeAccepted: true }
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaraAddon" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [billing]
      operationId: cancelMaraAddon
      summary: Remove MARA from the subscription (owner only)
      description: |
        Removes the add-on and its seats at once; Stripe credits the unused rest of the period.
        Afterwards MARA is READ_ONLY: everything stays readable and exportable.
      responses:
        "202":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaraAddon" }
        default: { $ref: "#/components/responses/Problem" }
  /billing/invoices:
    get:
      tags: [billing]
      operationId: listBillingInvoices
      summary: ERIKA's e-invoices to this workspace
      description: Each paid Stripe invoice becomes an XRechnung-conformant ZUGFeRD invoice from ERIKA, emailed and copied into the inbox.
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingInvoiceList" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ERIKA_SESSION
      description: Server-side session after password and second factor.
  headers:
    ETag:
      description: Version of the resource, for `If-Match`.
      schema: { type: string }
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version being changed. Missing → 428, outdated → 412.
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per request (e.g. a UUID). Repeating a request with the same key returns the first result instead of acting twice.
      schema: { type: string, minLength: 1, maxLength: 200 }
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffLevelId:
      name: staffLevelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChecklistTemplateId:
      name: checklistTemplateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkOrderId:
      name: workOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VerificationCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z2-7]{10}$" }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArticleId:
      name: articleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      description: ID of the draft; it stays the same when the invoice is issued.
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SenderId:
      name: senderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IntakeId:
      name: intakeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecurringId:
      name: recurringId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Error as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Locale:
      type: string
      enum: [de, en]
    Role:
      type: string
      description: |
        OWNER and MEMBER work in the web app, ADVISOR (tax advisor) only reads. TECHNICIAN works only in the
        MARA app and can't sign in to the web app (403 `TECHNICIAN_USE_APP`, ADR 0039).
      enum: [OWNER, MEMBER, ADVISOR, TECHNICIAN]
    SignupPolicy:
      type: object
      required: [inviteOnly, termsVersion]
      properties:
        inviteOnly:
          type: boolean
          description: True during the closed beta; sign-up then needs an invitation link.
        termsVersion:
          type: string
          description: Version of the terms (incl. data-processing agreement) a new user accepts.
          examples: ["beta-2026-12"]
    SignupRequest:
      type: object
      description: "`workspaceName` is required unless `workspaceInvitation` is given."
      required: [email, password, displayName, termsAccepted]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: At least 12 characters; long passphrases are welcome.
        displayName: { type: string, minLength: 1, maxLength: 100 }
        workspaceName: { type: string, minLength: 1, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }
        termsAccepted:
          type: boolean
          description: The user accepts the terms and the data-processing agreement (must be true).
        invitationCode:
          type: string
          maxLength: 1000
          description: The `invite` parameter of the invitation link (closed beta).
        workspaceInvitation:
          type: string
          maxLength: 200
          description: Token from a workspace invitation email; the user joins that workspace.
    FeedbackCategory:
      type: string
      enum: [PROBLEM, IDEA, PRAISE, OTHER]
    FeedbackRequest:
      type: object
      required: [category, message]
      properties:
        category: { $ref: "#/components/schemas/FeedbackCategory" }
        message: { type: string, minLength: 1, maxLength: 4000 }
        page:
          type: string
          maxLength: 300
          description: Path of the page the user was on (no query string), e.g. /inbox.
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }
    TotpRequest:
      type: object
      description: Exactly one of `code` (from the app) or `recoveryCode`.
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string, maxLength: 20 }
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    TotpEnrolment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: "`otpauth://totp/...` URI for the QR code."
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
    SessionState:
      type: string
      enum: [ANONYMOUS, TOTP_REQUIRED, TOTP_ENROLMENT_REQUIRED, AUTHENTICATED]
    SessionUser:
      type: object
      required: [id, email, displayName, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
    SessionWorkspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        closed:
          type: boolean
          description: The account was closed; the workspace is read-only (EX-04).
    WorkspaceChoice:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Session:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/SessionState" }
        user: { $ref: "#/components/schemas/SessionUser" }
        workspace: { $ref: "#/components/schemas/SessionWorkspace" }
        role: { $ref: "#/components/schemas/Role" }
        workspaces:
          type: array
          description: Every workspace the signed-in user can open in the web app (for switching).
          items: { $ref: "#/components/schemas/WorkspaceChoice" }
        features: { $ref: "#/components/schemas/SessionFeatures" }
    SwitchWorkspaceRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId: { type: string, format: uuid }
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
    InvitationState:
      type: string
      enum: [OPEN, ACCEPTED, EXPIRED, REVOKED]
    InvitationRole:
      type: string
      description: TECHNICIAN works only in the MARA app (ADR 0039).
      enum: [MEMBER, ADVISOR, TECHNICIAN]
    InvitationPreview:
      type: object
      required: [workspaceName, email, role, state, accountExists]
      properties:
        workspaceName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        state: { $ref: "#/components/schemas/InvitationState" }
        accountExists:
          type: boolean
          description: An account with the invited address exists (sign in to accept), else sign up.
    InvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/InvitationRole" }
    Invitation:
      type: object
      required: [id, email, role, state, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/InvitationRole" }
        state: { $ref: "#/components/schemas/InvitationState" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        invitedByName: { type: string }
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
    MemberRoleChange:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    WorkspaceClosureRequest:
      type: object
      required: [confirmName]
      properties:
        confirmName: { type: string, minLength: 1, maxLength: 200 }
    Workspace:
      type: object
      required: [id, name, countryCode, plan, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        street: { type: string }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, examples: ["DE"] }
        vatId:
          type: string
          description: USt-IdNr. (BT-31)
        taxNumber:
          type: string
          description: Steuernummer (BT-32)
        plan: { type: string }
        updatedAt: { type: string, format: date-time }
        closedAt:
          type: string
          format: date-time
          description: When the account was closed; the workspace is read-only since then.
        deleteAfter:
          type: string
          format: date
          description: The data of a closed workspace is kept until this day (last retention date).
    WorkspaceUpdate:
      type: object
      required: [name, countryCode]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        street: { type: string, maxLength: 200 }
        postalCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        vatId: { type: string, pattern: "^[A-Za-z]{2}[0-9A-Za-z+*.]{2,12}$" }
        taxNumber: { type: string, pattern: "^[0-9][0-9 /]{8,18}[0-9]$" }
    Member:
      type: object
      required: [id, userId, displayName, email, role, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        totpEnabled: { type: boolean }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    NotificationSettings:
      type: object
      required: [emailOnNewDocuments]
      properties:
        emailOnNewDocuments:
          type: boolean
          description: Send an email when new documents arrive (one email per upload or incoming email).
        emailOnDueDates:
          type: boolean
          description: Send an email 3 days before received invoices are due (AR-05). Absent in an update = unchanged.
    IntakeAddress:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Email address for incoming invoices, e.g. `k3m9q2xw4a7t5b8c1d6e@in.erika-app.de`.
    UploadRequest:
      type: object
      required: [fileName, size, contentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: Exact size in bytes; at most 20 MB.
        contentType:
          type: string
          maxLength: 100
          description: Media type the browser will send, e.g. `application/xml`, `application/pdf`, `application/zip`.
    UploadStatus:
      type: string
      description: |
        AWAITING_FILE: send the file to `uploadUrl`. RECEIVED: queued. DONE: see `items`.
        REJECTED: the whole file was refused (see `reason`). FAILED: processing failed; try again.
      enum: [AWAITING_FILE, RECEIVED, PROCESSING, DONE, REJECTED, FAILED]
    IntakeOutcome:
      type: string
      description: |
        IMPORTED: a new document. ALREADY_IN_ARCHIVE: the same file is already in the archive
        (shown as "possible duplicate", IN-05); `documentId` is the existing document. REJECTED: see `reason`.
      enum: [IMPORTED, ALREADY_IN_ARCHIVE, REJECTED]
    IntakeReason:
      type: string
      enum:
        - VIRUS_FOUND
        - UNSUPPORTED_FILE_TYPE
        - FILE_TOO_LARGE
        - EMPTY_FILE
        - FILE_MISSING
        - ZIP_TOO_DEEP
        - ZIP_TOO_MANY_FILES
        - ZIP_BOMB
        - ZIP_ENCRYPTED
        - ZIP_DAMAGED
        - NO_ATTACHMENTS
    IntakeItem:
      type: object
      required: [fileName, outcome]
      properties:
        fileName:
          type: string
          description: Name of the file; for files from a ZIP, the path inside it (`rechnungen.zip/re-1.xml`).
        outcome: { $ref: "#/components/schemas/IntakeOutcome" }
        reason: { $ref: "#/components/schemas/IntakeReason" }
        documentId: { type: string, format: uuid }
    Upload:
      type: object
      required: [id, fileName, size, status, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        size: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/UploadStatus" }
        reason:
          $ref: "#/components/schemas/IntakeReason"
        createdAt: { type: string, format: date-time }
        uploadUrl:
          type: string
          description: Only while AWAITING_FILE. Send the file here with `PUT`.
        uploadHeaders:
          type: object
          additionalProperties: { type: string }
          description: Headers to send with the `PUT`, exactly as given.
        uploadExpiresAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/IntakeItem" }
    InboxSummary:
      type: object
      required: [newDocuments, processing]
      properties:
        newDocuments:
          type: integer
          format: int32
          description: Documents with status NEW (not yet looked at), for the badge.
        processing:
          type: integer
          format: int32
          description: Documents still being read and validated.
    DocumentStatus:
      type: string
      description: |
        Incoming documents (AR-03): NEW, CHECKED, APPROVED, PAID, DISPUTED, BOOKED.
        Outgoing invoices: ISSUED, SENT, DELIVERY_FAILED, PAID, CANCELLED, BOOKED; users may set
        SENT, PAID and BOOKED, the others are set by ERIKA.
      enum: [NEW, CHECKED, APPROVED, PAID, DISPUTED, BOOKED, ISSUED, SENT, DELIVERY_FAILED, CANCELLED]
    DocumentFormat:
      type: string
      description: |
        Detected format. UNKNOWN: not yet read. UNREADABLE: the file could not be read.
        PDF_ONLY: "not an e-invoice (other invoice)" (IN-04). UNSUPPORTED: readable but not a supported invoice format.
      enum: [UNKNOWN, XRECHNUNG_UBL, XRECHNUNG_CII, UBL, CII, ZUGFERD, PDF_ONLY, UNSUPPORTED, UNREADABLE]
    NotEInvoiceReason:
      type: string
      description: Why the document doesn't count as an e-invoice; absent for e-invoices.
      enum: [PLAIN_PDF, INSUFFICIENT_PROFILE, ZUGFERD_1, UNKNOWN_XML, UNKNOWN_PROFILE, UNREADABLE]
    DocumentType:
      type: string
      enum: [UNKNOWN, INVOICE, CREDIT_NOTE, OTHER]
    ProcessingState:
      type: string
      description: PENDING while the file is read and validated in the background.
      enum: [PENDING, DONE, FAILED]
    ReceivedVia:
      type: string
      enum: [UPLOAD, EMAIL, CREATED]
    ValidationLevel:
      type: string
      enum: [VALID, WARNING, ERROR]
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Decimal amount as a string, e.g. "1234.50".
    DocumentSummary:
      type: object
      required: [id, receivedAt, receivedVia, format, docType, status, processing]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        receivedVia: { $ref: "#/components/schemas/ReceivedVia" }
        fileName: { type: string }
        format: { $ref: "#/components/schemas/DocumentFormat" }
        notEInvoiceReason: { $ref: "#/components/schemas/NotEInvoiceReason" }
        docType: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        processing: { $ref: "#/components/schemas/ProcessingState" }
        invoiceNumber: { type: string }
        issueDate: { type: string, format: date }
        sellerName: { type: string }
        grossAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        validationLevel: { $ref: "#/components/schemas/ValidationLevel" }
        duplicateOf:
          type: string
          format: uuid
          description: An earlier document with the same supplier tax ID, invoice number and gross amount ("possible duplicate", IN-05).
        tags:
          type: array
          items: { type: string }
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
    InvoiceSummary:
      type: object
      properties:
        invoiceNumber: { type: string, description: BT-1 }
        issueDate: { type: string, format: date, description: BT-2 }
        dueDate: { type: string, format: date, description: BT-9 }
        currency: { type: string, description: BT-5 }
        sellerName: { type: string, description: BT-27 }
        sellerTaxId: { type: string, description: "BT-31, or BT-32 when there is no VAT ID" }
        buyerName: { type: string, description: BT-44 }
        netAmount: { $ref: "#/components/schemas/Money" }
        taxAmount: { $ref: "#/components/schemas/Money" }
        grossAmount: { $ref: "#/components/schemas/Money" }
    MessageSeverity:
      type: string
      enum: [ERROR, WARNING, INFO]
    ValidationMessage:
      type: object
      required: [ruleId, severity, source, text]
      properties:
        ruleId: { type: string, examples: ["BR-DE-15"] }
        severity: { $ref: "#/components/schemas/MessageSeverity" }
        source:
          type: string
          enum: [FORMAT, XML_SCHEMA, SCHEMATRON, PDFA, CONTENT]
        text:
          type: string
          description: Plain-language German explanation (VW-04).
        originalText:
          type: string
          description: The rule's published text (mostly English).
        location: { type: string, description: "XPath of the element concerned, if known." }
    ValidationResult:
      type: object
      required: [level, applicable, packId, checkedAt, messages]
      properties:
        level: { $ref: "#/components/schemas/ValidationLevel" }
        applicable:
          type: boolean
          description: False if the file can't be validated as an e-invoice (plain PDF, MINIMUM profile …).
        packId:
          type: string
          description: Validation pack that was applied (BR-07), e.g. `xrechnung-3.0.2_2026-08-31`.
        scenario: { type: string }
        checkedAt: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ValidationMessage" }
    Document:
      type: object
      required: [id, direction, receivedAt, receivedVia, format, docType, status, processing, sha256, sizeBytes, mediaType]
      properties:
        id: { type: string, format: uuid }
        direction:
          type: string
          enum: [IN, OUT]
        receivedAt: { type: string, format: date-time }
        receivedVia: { $ref: "#/components/schemas/ReceivedVia" }
        fileName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256:
          type: string
          description: SHA-256 of the original, as archived (AR-01).
        format: { $ref: "#/components/schemas/DocumentFormat" }
        profile:
          type: string
          description: Detected profile, e.g. XRECHNUNG, EN16931, BASIC.
        notEInvoiceReason: { $ref: "#/components/schemas/NotEInvoiceReason" }
        docType: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        processing: { $ref: "#/components/schemas/ProcessingState" }
        duplicateOf:
          type: string
          format: uuid
          description: An earlier document with the same supplier tax ID, invoice number and gross amount ("possible duplicate", IN-05).
        invoice: { $ref: "#/components/schemas/InvoiceSummary" }
        validation: { $ref: "#/components/schemas/ValidationResult" }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        viewAvailable:
          type: boolean
          description: The invoice view and PDF view copy exist (structured invoices, once read).
        transfer: { $ref: "#/components/schemas/TransferDetails" }
        history:
          type: array
          description: Status changes, oldest first (AR-03).
          items: { $ref: "#/components/schemas/StatusEvent" }
    StatusEvent:
      type: object
      required: [toStatus, at]
      properties:
        fromStatus: { $ref: "#/components/schemas/DocumentStatus" }
        toStatus: { $ref: "#/components/schemas/DocumentStatus" }
        note: { type: string }
        at: { type: string, format: date-time }
        userId: { type: string, format: uuid }
        userName: { type: string }
    DocumentUpdate:
      type: object
      description: Absent fields stay unchanged.
      properties:
        status: { $ref: "#/components/schemas/DocumentStatus" }
        statusNote:
          type: string
          maxLength: 500
          description: Note for the history entry of this status change.
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 50 }
        note:
          type: string
          maxLength: 2000
          description: Free note on the document; an empty string removes it.
    BulkStatusChange:
      type: object
      required: [documentIds, status]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        note: { type: string, maxLength: 500 }
    BulkStatusResult:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int32 }
    ViewField:
      type: object
      required: [bt, label, value]
      properties:
        bt: { type: string, description: "Business term, e.g. BT-31", examples: ["BT-31"] }
        label: { type: string, description: German label }
        value: { type: string, description: Formatted for German readers }
    ViewSection:
      type: object
      required: [id, title, fields, sections]
      properties:
        id: { type: string, description: "Business group (BG-4) or HEADER / REFERENCES" }
        title: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ViewField" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ViewSection" }
    ViewAttachment:
      type: object
      required: [index, sizeBytes]
      properties:
        index: { type: integer, format: int32 }
        fileName: { type: string }
        mimeCode: { type: string }
        sizeBytes: { type: integer, format: int32 }
    InvoiceView:
      type: object
      required: [title, sections, attachments]
      properties:
        language:
          type: string
          enum: [de, en]
          description: Language of the labels and values.
        title: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ViewSection" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ViewAttachment" }
    HealthStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
    ComponentHealth:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        detail:
          type: string
          description: Short, non-sensitive explanation when the component isn't UP.
    HealthComponents:
      type: object
      required: [database, objectStorage, worker]
      properties:
        database:
          $ref: "#/components/schemas/ComponentHealth"
        objectStorage:
          $ref: "#/components/schemas/ComponentHealth"
        worker:
          $ref: "#/components/schemas/ComponentHealth"
    Health:
      type: object
      required: [status, version, checkedAt, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          examples: ["0.1.0"]
        checkedAt:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/HealthComponents"
    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable machine-readable code.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable error code, e.g. VALIDATION_FAILED, NUMBER_CONFLICT.
          examples: ["VALIDATION_FAILED"]
    InvoiceFormat:
      type: string
      description: |
        Output format (CR-02). XRECHNUNG_CII / XRECHNUNG_UBL: XRechnung 3.0 XML (needs the
        buyer reference and the buyer's email address). ZUGFERD_EN16931: PDF/A-3 with embedded
        XML, readable by people and machines.
      enum: [XRECHNUNG_CII, XRECHNUNG_UBL, ZUGFERD_EN16931]
    VatTreatment:
      type: string
      description: |
        DOMESTIC: VAT per line (19 %, 7 %, 0 %). REVERSE_CHARGE: the customer owes the VAT
        (§ 13b UStG, category AE). INTRA_EU: tax-free intra-EU supply (category K). For
        Kleinunternehmer (invoice settings) every line gets category E with the § 19 UStG note.
      enum: [DOMESTIC, REVERSE_CHARGE, INTRA_EU]
    VatRate:
      type: string
      description: "Line VAT rate for DOMESTIC invoices: 19 %, 7 % or 0 %."
      enum: [STANDARD_19, REDUCED_7, ZERO]
    SessionFeatures:
      type: object
      description: Optional product areas switched on for this installation.
      required: [mara]
      properties:
        mara:
          type: boolean
          description: MARA job reports (work orders, calendar, staff) are available here; whether this workspace has booked them is `GET /billing/addons/mara`.
    CustomerType:
      type: string
      description: BUSINESS or PRIVATE (MARA M-OF-01; private customers get the § 35a labour share on invoices, Stage 8).
      enum: [BUSINESS, PRIVATE]
    SiteInput:
      type: object
      required: [customerId, name, countryCode]
      properties:
        customerId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, description: "e.g. Wohnung 3.2, Baustelle Haus B" }
        street: { type: string, maxLength: 200 }
        postalCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        notes: { type: string, maxLength: 1000, description: "Access, key box, contact on site" }
        archived: { type: boolean, default: false }
    Site:
      type: object
      required: [id, customerId, name, countryCode, archived, version]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        name: { type: string }
        street: { type: string }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string }
        notes: { type: string }
        archived: { type: boolean }
        version: { type: integer, format: int32 }
    SiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Site" }
    StaffLevelInput:
      type: object
      required: [name, hourlyRate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: "e.g. Meister, Geselle, Auszubildende" }
        hourlyRate: { $ref: "#/components/schemas/Decimal" }
        archived: { type: boolean, default: false }
    StaffLevel:
      type: object
      required: [id, name, hourlyRate, archived, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hourlyRate: { $ref: "#/components/schemas/Decimal" }
        archived: { type: boolean }
        version: { type: integer, format: int32 }
    StaffLevelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffLevel" }
    StaffSettings:
      type: object
      required: [canSeePrices]
      properties:
        staffLevelId: { type: string, format: uuid, description: "Empty = no staff level" }
        canSeePrices: { type: boolean, description: "Technicians see prices in the app only if set (ADR 0039)" }
    SyncConflict:
      type: object
      required: [id, entity, entityId, field, winner, userId, displayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        entity: { type: string, description: "work_order or customer" }
        entityId: { type: string, format: uuid }
        field: { type: string }
        serverValue: { type: string, description: The value in ERIKA before the phone's change (JSON) }
        deviceValue: { type: string, description: The phone's value (JSON) }
        winner: { type: string, enum: [SERVER, DEVICE] }
        userId: { type: string, format: uuid }
        displayName: { type: string, description: Who changed it on the phone }
        createdAt: { type: string, format: date-time }
    SyncConflictList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SyncConflict" }
    DevicePlatform:
      type: string
      enum: [ANDROID, IOS]
    DeviceRevokedReason:
      type: string
      description: OWNER = revoked in the web app; TOKEN_REUSE = a copied refresh token was used; SIGNED_OUT = signed out in the app.
      enum: [OWNER, TOKEN_REUSE, SIGNED_OUT]
    Device:
      type: object
      required: [id, userId, displayName, name, platform, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string, description: The person who signed in on the phone }
        role:
          $ref: "#/components/schemas/Role"
          description: Missing when the person has left the workspace.
        name: { type: string, description: "Name the app reported, e.g. the phone model" }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        lastSyncAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        revokedReason: { $ref: "#/components/schemas/DeviceRevokedReason" }
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
    StaffMember:
      type: object
      required: [memberId, userId, displayName, role, canSeePrices]
      properties:
        memberId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        staffLevelId: { type: string, format: uuid }
        canSeePrices: { type: boolean }
    StaffList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffMember" }
    ChecklistItemKind:
      type: string
      enum: [YES_NO, VALUE, PHOTO, COMMENT]
    ChecklistItem:
      type: object
      required: [key, label, kind, required]
      properties:
        key: { type: string, pattern: "^[a-z0-9_-]{1,40}$", description: "Stable within the template; answers refer to it" }
        label: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: "#/components/schemas/ChecklistItemKind" }
        required: { type: boolean, description: "Mandatory items block completing the report (M-MO-07)" }
    ChecklistTemplateInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ChecklistItem" }
        archived: { type: boolean, default: false }
    ChecklistTemplate:
      type: object
      required: [id, name, items, archived, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
