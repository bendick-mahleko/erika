        travelFlatAmount: { $ref: "#/components/schemas/Decimal" }
        travelHourlyRate: { $ref: "#/components/schemas/Decimal" }
    CustomerBillingSettings:
      type: object
      properties:
        billingUnitMinutes: { type: integer, format: int32, enum: [1, 5, 6, 10, 15, 30, 60] }
        travelMode: { $ref: "#/components/schemas/TravelMode" }
        travelFlatAmount: { $ref: "#/components/schemas/Decimal" }
        travelHourlyRate: { $ref: "#/components/schemas/Decimal" }
    BillableReport:
      type: object
