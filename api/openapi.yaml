          items: { type: string, format: uuid }
        checklistTemplateId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/WorkOrderStatus" }
    WorkOrder:
      type: object
      required: [id, customerId, customerName, title, status, assigneeIds, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        address: { type: string, description: "Where the work is (site, else customer), one line for list and calendar" }
        title: { type: string }
        description: { type: string }
        plannedFrom: { type: string, format: date-time }
        plannedTo: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/WorkOrderStatus" }
        assigneeIds:
          type: array
          items: { type: string, format: uuid }
        checklistTemplateId: { type: string, format: uuid }
        workNotes: { type: string, description: "Notes the technicians wrote in the MARA app (read-only here)" }
        version: { type: integer, format: int32 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
