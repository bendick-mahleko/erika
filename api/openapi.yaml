        reportId: { type: string, format: uuid, description: "The report it came from (preview only)" }
        kind: { type: string, enum: [WORK, TRAVEL, MATERIAL, OTHER] }
        articleId: { type: string, format: uuid }
        articleNumber: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string, pattern: "^[A-Z0-9]{1,3}$" }
        netPrice: { $ref: "#/components/schemas/Decimal" }
        vatRate: { $ref: "#/components/schemas/VatRate" }
