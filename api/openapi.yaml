        iban: { type: string, maxLength: 40 }
        bic: { type: string, maxLength: 11 }
        accountHolder: { type: string, maxLength: 200 }
        kleinunternehmer:
          type: boolean
          description: Kleinunternehmer under § 19 UStG (BR-06); invoices then carry no VAT.
        numberPattern:
          type: string
          maxLength: 40
          description: |
