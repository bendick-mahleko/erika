openapi: 3.1.0
info:
  title: ERIKA API
  version: 0.3.0
  summary: E-Rechnung Inbox & Creator
  description: |
    Contract for the ERIKA back end. This file is the source of truth:
    the Kotlin server interfaces and the TypeScript client are generated from it.

    Conventions (Software Design §6):
    - Base path `/api/v1`, JSON, UTF-8, ISO 8601 dates.
    - Money as decimal strings ("1234.50") plus a currency code.
    - The workspace comes from the session, never from the URL.
    - Errors are RFC 9457 problem details with a stable `code`.
    - `Idempotency-Key` header on POST requests that create or send something.

    Authentication (Software Design §7): server-side session cookie `ERIKA_SESSION`
    after password **and** second factor (TOTP). State-changing requests need the
    CSRF token: read the `XSRF-TOKEN` cookie (set by `GET /auth/session`) and send it
    in the `X-XSRF-TOKEN` header.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: system
    description: Operational endpoints
  - name: auth
    description: Sign-up, sign-in with 2FA, sign-out (EX-02, NF-02)
  - name: workspace
    description: The signed-in user's workspace (from the session, never from the URL)
  - name: members
    description: Users of the workspace and their roles
  - name: notifications
    description: The signed-in user's notification preferences
  - name: intake
    description: Receiving files by upload and email (IN-01, IN-02, IN-05, NF-04)
  - name: documents
    description: Received documents, the viewer, status, tags and search (IN-04, IN-05, VW-01..06, AR-01..04)
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health
      description: |
        Reports whether the API can reach its database and object storage and
        whether the background worker is alive. Returns 503 when the service
        can't serve requests.
      security: []
      responses:
        "200":
          description: The service is up (possibly degraded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The service is down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current sign-in state
      description: Also sets the `XSRF-TOKEN` cookie needed for state-changing requests.
      security: []
      responses:
        "200":
          description: Sign-in state of this browser session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: Create an account and its workspace
      description: |
        Creates the user (role OWNER) and the workspace and sends a verification email.
        Always answers 202, also when the email address is already registered (that
        address gets a notice instead), so the endpoint doesn't reveal accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
            example: { email: "erika@example.de", password: "correct horse battery staple", displayName: "Erika Mustermann", workspaceName: "Mustermann Malerbetrieb", locale: "de" }
      responses:
        "202": { description: Accepted; check your email. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
            example: { token: "q3J1cHRvZ3JhcGhpY2FsbHktcmFuZG9tLXRva2Vu" }
      responses:
        "204": { description: Email address verified. }
        default: { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: First step of sign-in (email and password)
      description: |
        On success the session waits for the second factor: state `TOTP_REQUIRED`, or
        `TOTP_ENROLMENT_REQUIRED` if the user has not set up an authenticator app yet.
        Wrong credentials, unknown users and locked accounts all answer 401
        `INVALID_CREDENTIALS`. Five failures lock the account for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { email: "erika@example.de", password: "correct horse battery staple" }
      responses:
        "200":
          description: Password accepted; second factor needed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp:
    post:
      tags: [auth]
      operationId: verifyTotp
      summary: Second step of sign-in (authenticator code or recovery code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpRequest" }
            example: { code: "123456" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp/enrolment:
    post:
      tags: [auth]
      operationId: startTotpEnrolment
      summary: Start setting up the authenticator app
      description: Only after the password step, while the state is `TOTP_ENROLMENT_REQUIRED`.
      security: []
      responses:
        "200":
          description: Secret to scan as a QR code (otpauth URI) or type in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/totp/enrolment/confirm:
    post:
      tags: [auth]
      operationId: confirmTotpEnrolment
      summary: Finish setting up the authenticator app
      description: |
        Checks the first code from the app, turns 2FA on, signs the user in and returns
        ten single-use recovery codes. They are shown only this once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
            example: { code: "123456" }
      responses:
        "200":
          description: 2FA enabled and signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: Sign out (ends the server-side session)
      security: []
      responses:
        "204": { description: Signed out. }
        default: { $ref: "#/components/responses/Problem" }
  /workspace:
    get:
      tags: [workspace]
      operationId: getWorkspace
      summary: Workspace settings
      responses:
        "200":
          description: The workspace of the session.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [workspace]
      operationId: updateWorkspace
      summary: Change workspace settings (owner only)
      description: Needs `If-Match` with the ETag from `GET /workspace` (optimistic locking).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceUpdate" }
            example: { name: "Mustermann Malerbetrieb", street: "Musterstraße 1", postalCode: "10115", city: "Berlin", countryCode: "DE", vatId: "DE123456789", taxNumber: "30/123/45678" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Users of the workspace
      responses:
        "200":
          description: All members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        default: { $ref: "#/components/responses/Problem" }
  /members/{memberId}:
    get:
      tags: [members]
      operationId: getMember
      summary: One member of the workspace
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }
  /notification-settings:
    get:
      tags: [notifications]
      operationId: getNotificationSettings
      summary: The signed-in user's notification preferences in this workspace
      responses:
        "200":
          description: Current preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [notifications]
      operationId: updateNotificationSettings
      summary: Change the signed-in user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
            example: { emailOnNewDocuments: true }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        default: { $ref: "#/components/responses/Problem" }
  /intake/address:
    get:
      tags: [intake]
      operationId: getIntakeAddress
      summary: The workspace's email address for incoming invoices (IN-01)
      description: Suppliers send invoices to this address; attachments (XML, PDF, ZIP) are imported automatically.
      responses:
        "200":
          description: The intake address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeAddress" }
        default: { $ref: "#/components/responses/Problem" }
  /uploads:
    post:
      tags: [intake]
      operationId: createUpload
      summary: Start an upload (IN-02)
      description: |
        Announces one file (XML, PDF or ZIP, at most 20 MB) and returns a short-lived URL.
        The browser sends the file there with `PUT`, using exactly the returned headers,
        and then calls `POST /uploads/{uploadId}/complete`. The file is virus-scanned,
        unpacked if it is a ZIP, archived and validated in the background.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
            example: { fileName: "rechnung-2026-0815.xml", size: 24576, contentType: "application/xml" }
      responses:
        "201":
          description: Upload started; send the file to `uploadUrl`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /uploads/{uploadId}:
    get:
      tags: [intake]
      operationId: getUpload
      summary: State and result of an upload
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: The upload with one item per file found in it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /uploads/{uploadId}/complete:
    post:
      tags: [intake]
      operationId: completeUpload
      summary: Confirm that the file has been sent
      description: |
        Checks that the file arrived with the announced size and queues it for processing.
        Calling it again for an upload that is already being processed returns its state.
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "202":
          description: The file is queued for processing; poll `GET /uploads/{uploadId}`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        default: { $ref: "#/components/responses/Problem" }
  /inbox/summary:
    get:
      tags: [documents]
      operationId: getInboxSummary
      summary: Counts for the in-app badge
      responses:
        "200":
          description: Number of new documents and of documents still being processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Documents of the workspace, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          description: "`nextCursor` from the previous page."
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [IN, OUT]
        - name: from
          in: query
          required: false
          description: Invoice date (BT-2) from this day; documents without one count by their receipt date.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Invoice date (BT-2) up to this day, inclusive.
          schema: { type: string, format: date }
        - name: q
          in: query
          required: false
          description: |
            Search text (AR-04): German full-text search over supplier, buyer, invoice number,
            item names and notes, plus fuzzy matching of supplier names and the file name.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
      responses:
        "200":
          description: One page of documents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: One document with its invoice data, latest validation result and status history
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [documents]
      operationId: updateDocument
      summary: Change status, tags or note (metadata only; the original never changes)
      description: |
        A status change is recorded in the history with user, time and the optional
        `statusNote` (AR-03), and audited (AR-02). Fields that are absent stay as they are.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUpdate" }
            example: { status: "CHECKED", statusNote: "Rechnung geprüft, Betrag stimmt", tags: ["Material"] }
      responses:
        "200":
          description: The changed document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/status:
    post:
      tags: [documents]
      operationId: changeDocumentStatus
      summary: Set the status of several documents at once
      description: Each changed document gets its own history entry and audit entry. Unknown IDs are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkStatusChange" }
            example: { documentIds: ["7c9e6679-7425-40de-944b-e07fc1f90ae7"], status: "APPROVED", note: "Freigegeben" }
      responses:
        "200":
          description: How many documents changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkStatusResult" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/view:
    get:
      tags: [documents]
      operationId: getDocumentView
      summary: The invoice for reading, every business term with its German label (VW-01)
      description: 404 `VIEW_NOT_AVAILABLE` for documents that aren't structured invoices or are still being read.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The invoice view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceView" }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/view-pdf:
    get:
      tags: [documents]
      operationId: getDocumentViewPdf
      summary: PDF view copy, marked "Ansichtskopie – Original ist die XML-Datei" on every page (VW-02)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The PDF view copy.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/original:
    get:
      tags: [documents]
      operationId: getDocumentOriginal
      summary: The original file, unchanged (AR-01)
      description: |
        The SHA-256 is checked before the file is sent and returned in `Repr-Digest`
        (RFC 9530) and `Digest` (RFC 3230), so the recipient can verify it.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: The original, as a download.
          headers:
            Repr-Digest:
              description: "`sha-256=:<base64>:`"
              schema: { type: string }
            Digest:
              description: "`sha-256=<base64>`"
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/attachments/{attachmentIndex}:
    get:
      tags: [documents]
      operationId: getDocumentAttachment
      summary: An attachment embedded in the invoice (BT-125), decoded, as a download (VW-06)
      description: Always sent as a download with a strict Content Security Policy, never shown inline.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: attachmentIndex
          in: path
          required: true
          description: "`index` from the view's `attachments`."
          schema: { type: integer, format: int32, minimum: 0, maximum: 999 }
      responses:
        "200":
          description: The attachment in its original format.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /documents/{documentId}/revalidate:
    post:
      tags: [documents]
      operationId: revalidateDocument
      summary: Read and validate the document again with the current validation pack
      description: Adds a new validation result; earlier results stay in the history (BR-07).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "202":
          description: Queued; the document shows processing PENDING until done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ERIKA_SESSION
      description: Server-side session after password and second factor.
  headers:
    ETag:
      description: Version of the resource, for `If-Match`.
      schema: { type: string }
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag of the version being changed. Missing → 428, outdated → 412.
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Error as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Locale:
      type: string
      enum: [de, en]
    Role:
      type: string
      enum: [OWNER, MEMBER, ADVISOR]
    SignupRequest:
      type: object
      required: [email, password, displayName, workspaceName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: At least 12 characters; long passphrases are welcome.
        displayName: { type: string, minLength: 1, maxLength: 100 }
        workspaceName: { type: string, minLength: 1, maxLength: 200 }
        locale: { $ref: "#/components/schemas/Locale" }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }
    TotpRequest:
      type: object
      description: Exactly one of `code` (from the app) or `recoveryCode`.
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string, maxLength: 20 }
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    TotpEnrolment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauthUri:
          type: string
          description: "`otpauth://totp/...` URI for the QR code."
    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
    SessionState:
      type: string
      enum: [ANONYMOUS, TOTP_REQUIRED, TOTP_ENROLMENT_REQUIRED, AUTHENTICATED]
    SessionUser:
      type: object
      required: [id, email, displayName, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
    SessionWorkspace:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Session:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/SessionState" }
        user: { $ref: "#/components/schemas/SessionUser" }
        workspace: { $ref: "#/components/schemas/SessionWorkspace" }
        role: { $ref: "#/components/schemas/Role" }
    Workspace:
      type: object
      required: [id, name, countryCode, plan, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        street: { type: string }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, examples: ["DE"] }
        vatId:
          type: string
          description: USt-IdNr. (BT-31)
        taxNumber:
          type: string
          description: Steuernummer (BT-32)
        plan: { type: string }
        updatedAt: { type: string, format: date-time }
    WorkspaceUpdate:
      type: object
      required: [name, countryCode]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        street: { type: string, maxLength: 200 }
        postalCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        vatId: { type: string, pattern: "^[A-Za-z]{2}[0-9A-Za-z+*.]{2,12}$" }
        taxNumber: { type: string, pattern: "^[0-9][0-9 /]{8,18}[0-9]$" }
    Member:
      type: object
      required: [id, userId, displayName, email, role, totpEnabled]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        totpEnabled: { type: boolean }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    NotificationSettings:
      type: object
      required: [emailOnNewDocuments]
      properties:
        emailOnNewDocuments:
          type: boolean
          description: Send an email when new documents arrive (one email per upload or incoming email).
    IntakeAddress:
      type: object
      required: [address]
      properties:
        address:
          type: string
          description: Email address for incoming invoices, e.g. `k3m9q2xw4a7t5b8c1d6e@in.erika-app.de`.
    UploadRequest:
      type: object
      required: [fileName, size, contentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: Exact size in bytes; at most 20 MB.
        contentType:
          type: string
          maxLength: 100
          description: Media type the browser will send, e.g. `application/xml`, `application/pdf`, `application/zip`.
    UploadStatus:
      type: string
      description: |
        AWAITING_FILE: send the file to `uploadUrl`. RECEIVED: queued. DONE: see `items`.
        REJECTED: the whole file was refused (see `reason`). FAILED: processing failed; try again.
      enum: [AWAITING_FILE, RECEIVED, PROCESSING, DONE, REJECTED, FAILED]
    IntakeOutcome:
      type: string
      description: |
        IMPORTED: a new document. ALREADY_IN_ARCHIVE: the same file is already in the archive
        (shown as "possible duplicate", IN-05); `documentId` is the existing document. REJECTED: see `reason`.
      enum: [IMPORTED, ALREADY_IN_ARCHIVE, REJECTED]
    IntakeReason:
      type: string
      enum:
        - VIRUS_FOUND
        - UNSUPPORTED_FILE_TYPE
        - FILE_TOO_LARGE
        - EMPTY_FILE
        - FILE_MISSING
        - ZIP_TOO_DEEP
        - ZIP_TOO_MANY_FILES
        - ZIP_BOMB
        - ZIP_ENCRYPTED
        - ZIP_DAMAGED
        - NO_ATTACHMENTS
    IntakeItem:
      type: object
      required: [fileName, outcome]
      properties:
        fileName:
          type: string
          description: Name of the file; for files from a ZIP, the path inside it (`rechnungen.zip/re-1.xml`).
        outcome: { $ref: "#/components/schemas/IntakeOutcome" }
        reason: { $ref: "#/components/schemas/IntakeReason" }
        documentId: { type: string, format: uuid }
    Upload:
      type: object
      required: [id, fileName, size, status, createdAt, items]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        size: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/UploadStatus" }
        reason:
          $ref: "#/components/schemas/IntakeReason"
        createdAt: { type: string, format: date-time }
        uploadUrl:
          type: string
          description: Only while AWAITING_FILE. Send the file here with `PUT`.
        uploadHeaders:
          type: object
          additionalProperties: { type: string }
          description: Headers to send with the `PUT`, exactly as given.
        uploadExpiresAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/IntakeItem" }
    InboxSummary:
      type: object
      required: [newDocuments, processing]
      properties:
        newDocuments:
          type: integer
          format: int32
          description: Documents with status NEW (not yet looked at), for the badge.
        processing:
          type: integer
          format: int32
          description: Documents still being read and validated.
    DocumentStatus:
      type: string
      enum: [NEW, CHECKED, APPROVED, PAID, DISPUTED, BOOKED]
    DocumentFormat:
      type: string
      description: |
        Detected format. UNKNOWN: not yet read. UNREADABLE: the file could not be read.
        PDF_ONLY: "not an e-invoice (other invoice)" (IN-04). UNSUPPORTED: readable but not a supported invoice format.
      enum: [UNKNOWN, XRECHNUNG_UBL, XRECHNUNG_CII, UBL, CII, ZUGFERD, PDF_ONLY, UNSUPPORTED, UNREADABLE]
    NotEInvoiceReason:
      type: string
      description: Why the document doesn't count as an e-invoice; absent for e-invoices.
      enum: [PLAIN_PDF, INSUFFICIENT_PROFILE, ZUGFERD_1, UNKNOWN_XML, UNKNOWN_PROFILE, UNREADABLE]
    DocumentType:
      type: string
      enum: [UNKNOWN, INVOICE, CREDIT_NOTE, OTHER]
    ProcessingState:
      type: string
      description: PENDING while the file is read and validated in the background.
      enum: [PENDING, DONE, FAILED]
    ReceivedVia:
      type: string
      enum: [UPLOAD, EMAIL, CREATED]
    ValidationLevel:
      type: string
      enum: [VALID, WARNING, ERROR]
    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]+)?$"
      description: Decimal amount as a string, e.g. "1234.50".
    DocumentSummary:
      type: object
      required: [id, receivedAt, receivedVia, format, docType, status, processing]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        receivedVia: { $ref: "#/components/schemas/ReceivedVia" }
        fileName: { type: string }
        format: { $ref: "#/components/schemas/DocumentFormat" }
        notEInvoiceReason: { $ref: "#/components/schemas/NotEInvoiceReason" }
        docType: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        processing: { $ref: "#/components/schemas/ProcessingState" }
        invoiceNumber: { type: string }
        issueDate: { type: string, format: date }
        sellerName: { type: string }
        grossAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        validationLevel: { $ref: "#/components/schemas/ValidationLevel" }
        duplicateOf:
          type: string
          format: uuid
          description: An earlier document with the same supplier tax ID, invoice number and gross amount ("possible duplicate", IN-05).
        tags:
          type: array
          items: { type: string }
    DocumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DocumentSummary" }
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
    InvoiceSummary:
      type: object
      properties:
        invoiceNumber: { type: string, description: BT-1 }
        issueDate: { type: string, format: date, description: BT-2 }
        dueDate: { type: string, format: date, description: BT-9 }
        currency: { type: string, description: BT-5 }
        sellerName: { type: string, description: BT-27 }
        sellerTaxId: { type: string, description: "BT-31, or BT-32 when there is no VAT ID" }
        buyerName: { type: string, description: BT-44 }
        netAmount: { $ref: "#/components/schemas/Money" }
        taxAmount: { $ref: "#/components/schemas/Money" }
        grossAmount: { $ref: "#/components/schemas/Money" }
    MessageSeverity:
      type: string
      enum: [ERROR, WARNING, INFO]
    ValidationMessage:
      type: object
      required: [ruleId, severity, source, text]
      properties:
        ruleId: { type: string, examples: ["BR-DE-15"] }
        severity: { $ref: "#/components/schemas/MessageSeverity" }
        source:
          type: string
          enum: [FORMAT, XML_SCHEMA, SCHEMATRON, PDFA, CONTENT]
        text:
          type: string
          description: Plain-language German explanation (VW-04).
        originalText:
          type: string
          description: The rule's published text (mostly English).
        location: { type: string, description: "XPath of the element concerned, if known." }
    ValidationResult:
      type: object
      required: [level, applicable, packId, checkedAt, messages]
      properties:
        level: { $ref: "#/components/schemas/ValidationLevel" }
        applicable:
          type: boolean
          description: False if the file can't be validated as an e-invoice (plain PDF, MINIMUM profile …).
        packId:
          type: string
          description: Validation pack that was applied (BR-07), e.g. `xrechnung-3.0.2_2026-08-31`.
        scenario: { type: string }
        checkedAt: { type: string, format: date-time }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ValidationMessage" }
    Document:
      type: object
      required: [id, direction, receivedAt, receivedVia, format, docType, status, processing, sha256, sizeBytes, mediaType]
      properties:
        id: { type: string, format: uuid }
        direction:
          type: string
          enum: [IN, OUT]
        receivedAt: { type: string, format: date-time }
        receivedVia: { $ref: "#/components/schemas/ReceivedVia" }
        fileName: { type: string }
        mediaType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256:
          type: string
          description: SHA-256 of the original, as archived (AR-01).
        format: { $ref: "#/components/schemas/DocumentFormat" }
        profile:
          type: string
          description: Detected profile, e.g. XRECHNUNG, EN16931, BASIC.
        notEInvoiceReason: { $ref: "#/components/schemas/NotEInvoiceReason" }
        docType: { $ref: "#/components/schemas/DocumentType" }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        processing: { $ref: "#/components/schemas/ProcessingState" }
        duplicateOf:
          type: string
          format: uuid
          description: An earlier document with the same supplier tax ID, invoice number and gross amount ("possible duplicate", IN-05).
        invoice: { $ref: "#/components/schemas/InvoiceSummary" }
        validation: { $ref: "#/components/schemas/ValidationResult" }
        tags:
          type: array
          items: { type: string }
        note: { type: string }
        viewAvailable:
          type: boolean
          description: The invoice view and PDF view copy exist (structured invoices, once read).
        history:
          type: array
          description: Status changes, oldest first (AR-03).
          items: { $ref: "#/components/schemas/StatusEvent" }
    StatusEvent:
      type: object
      required: [toStatus, at]
      properties:
        fromStatus: { $ref: "#/components/schemas/DocumentStatus" }
        toStatus: { $ref: "#/components/schemas/DocumentStatus" }
        note: { type: string }
        at: { type: string, format: date-time }
        userId: { type: string, format: uuid }
        userName: { type: string }
    DocumentUpdate:
      type: object
      description: Absent fields stay unchanged.
      properties:
        status: { $ref: "#/components/schemas/DocumentStatus" }
        statusNote:
          type: string
          maxLength: 500
          description: Note for the history entry of this status change.
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 50 }
        note:
          type: string
          maxLength: 2000
          description: Free note on the document; an empty string removes it.
    BulkStatusChange:
      type: object
      required: [documentIds, status]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        note: { type: string, maxLength: 500 }
    BulkStatusResult:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int32 }
    ViewField:
      type: object
      required: [bt, label, value]
      properties:
        bt: { type: string, description: "Business term, e.g. BT-31", examples: ["BT-31"] }
        label: { type: string, description: German label }
        value: { type: string, description: Formatted for German readers }
    ViewSection:
      type: object
      required: [id, title, fields, sections]
      properties:
        id: { type: string, description: "Business group (BG-4) or HEADER / REFERENCES" }
        title: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ViewField" }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ViewSection" }
    ViewAttachment:
      type: object
      required: [index, sizeBytes]
      properties:
        index: { type: integer, format: int32 }
        fileName: { type: string }
        mimeCode: { type: string }
        sizeBytes: { type: integer, format: int32 }
    InvoiceView:
      type: object
      required: [title, sections, attachments]
      properties:
        title: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ViewSection" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/ViewAttachment" }
    HealthStatus:
      type: string
      enum: [UP, DEGRADED, DOWN]
    ComponentHealth:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        detail:
          type: string
          description: Short, non-sensitive explanation when the component isn't UP.
    HealthComponents:
      type: object
      required: [database, objectStorage, worker]
      properties:
        database:
          $ref: "#/components/schemas/ComponentHealth"
        objectStorage:
          $ref: "#/components/schemas/ComponentHealth"
        worker:
          $ref: "#/components/schemas/ComponentHealth"
    Health:
      type: object
      required: [status, version, checkedAt, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          examples: ["0.1.0"]
        checkedAt:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/HealthComponents"
    Problem:
      type: object
      description: RFC 9457 problem details, extended with a stable machine-readable code.
      required: [title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable error code, e.g. VALIDATION_FAILED, NUMBER_CONFLICT.
          examples: ["VALIDATION_FAILED"]
