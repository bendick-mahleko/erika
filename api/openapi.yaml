      type: string
      description: DRAFT (editable), ISSUING (being numbered, generated and validated), ISSUED (frozen).
      enum: [DRAFT, ISSUING, ISSUED]
    BuyerData:
      type: object
      description: The customer as it appears on the invoice (a copy; later changes of the customer don't affect it).
      properties:
        customerNumber: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        street: { type: string, maxLength: 200 }
        additionalLine: { type: string, maxLength: 200 }
        postalCode: { type: string, maxLength: 20 }
        city: { type: string, maxLength: 100 }
        countryCode: { type: string, pattern: "^[A-Z]{2}$" }
        vatId: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 320 }
        contactName: { type: string, maxLength: 200 }
    InvoiceLineInput:
      type: object
      properties:
        articleId: { type: string, format: uuid, description: "The article it was taken from, if any." }
        articleNumber: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unitCode: { type: string, pattern: "^[A-Z0-9]{1,3}$" }
        netPrice: { $ref: "#/components/schemas/Decimal" }
        vatRate: { $ref: "#/components/schemas/VatRate" }
        laborCost:
          type: boolean
          description: Labour, machine or travel costs; their share is printed for private customers (§ 35a EStG).
    InvoiceContent:
      type: object
      description: The editable content of a draft. Everything is optional while editing; `problems` lists what issuing needs.
      properties:
        format: { $ref: "#/components/schemas/InvoiceFormat" }
        customerId: { type: string, format: uuid }
        buyer: { $ref: "#/components/schemas/BuyerData" }
        vatTreatment: { $ref: "#/components/schemas/VatTreatment" }
        issueDate:
          type: string
          format: date
          description: Invoice date (BT-2); empty = the day it is issued.
        deliveryDate: { type: string, format: date, description: "Date of supply (BT-72)" }
        periodStart: { type: string, format: date, description: "Service period from (BT-73)" }
        periodEnd: { type: string, format: date, description: "Service period to (BT-74)" }
        dueDate: { type: string, format: date, description: "BT-9; empty = invoice date plus the payment terms" }
        buyerReference: { type: string, maxLength: 100, description: "BT-10; mandatory for XRechnung" }
        orderReference: { type: string, maxLength: 100, description: "BT-13" }
        paymentTerms: { type: string, maxLength: 500, description: "BT-20; empty = generated from the due date" }
        note: { type: string, maxLength: 2000, description: "BT-22, printed on the invoice" }
        lines:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/InvoiceLineInput" }
    DraftProblem:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: "Path of the field, e.g. `buyer.name`, `lines[0].quantity`, `settings.iban`."
        code:
          type: string
          description: "REQUIRED, INVALID, REQUIRED_FOR_XRECHNUNG, VAT_ID_REQUIRED, PERIOD_ORDER, SETTINGS_INCOMPLETE …"
    VatAmount:
      type: object
      required: [category, rate, taxableAmount, taxAmount]
      properties:
        category: { type: string, description: "UNCL 5305: S, Z, E, AE, K" }
        rate: { $ref: "#/components/schemas/Money" }
        taxableAmount: { $ref: "#/components/schemas/Money" }
        taxAmount: { $ref: "#/components/schemas/Money" }
        note: { type: string, description: "Exemption reason / note printed on the invoice." }
    InvoiceTotals:
      type: object
      required: [currency, netAmount, taxAmount, grossAmount, vat]
      properties:
        currency: { type: string }
        netAmount: { $ref: "#/components/schemas/Money" }
        taxAmount: { $ref: "#/components/schemas/Money" }
        grossAmount: { $ref: "#/components/schemas/Money" }
        lineAmounts:
          type: array
          items: { $ref: "#/components/schemas/Money" }
        vat:
          type: array
          items: { $ref: "#/components/schemas/VatAmount" }
    InvoiceReference:
      type: object
      required: [id, number]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
    IssuedInfo:
      type: object
      required: [number, issueDate, documentId, status, issuedAt, fileName]
      properties:
        number: { type: string, description: BT-1 }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        documentId:
          type: string
          format: uuid
          description: The archived file is this document's original (`GET /documents/{documentId}/original`).
        status: { $ref: "#/components/schemas/DocumentStatus" }
        issuedAt: { type: string, format: date-time }
        fileName: { type: string }
    DeliveryStatus:
      type: string
      enum: [QUEUED, SENT, DELIVERED, BOUNCED, FAILED]
    InvoiceDelivery:
      type: object
      required: [id, to, subject, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        to: { type: string }
        subject: { type: string }
        status: { $ref: "#/components/schemas/DeliveryStatus" }
        detail: { type: string, description: "Reason given by the provider for a bounce or failure." }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
        archived: { type: boolean, description: "The sent message is in the archive." }
    Invoice:
      type: object
      required: [id, kind, state, version, content, problems, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        state: { $ref: "#/components/schemas/InvoiceState" }
        version: { type: integer, format: int32 }
        content: { $ref: "#/components/schemas/InvoiceContent" }
        totals: { $ref: "#/components/schemas/InvoiceTotals" }
        problems:
          type: array
          description: What is missing or wrong before the draft can be issued (empty when ready).
          items: { $ref: "#/components/schemas/DraftProblem" }
        issueError:
          type: array
          description: Validation messages of the last attempt to issue, if it failed.
          items: { $ref: "#/components/schemas/ValidationMessage" }
        original: { $ref: "#/components/schemas/InvoiceReference" }
        corrections:
          type: array
          description: Credit notes, cancellations and corrections of this invoice.
          items: { $ref: "#/components/schemas/InvoiceReference" }
        issued: { $ref: "#/components/schemas/IssuedInfo" }
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/InvoiceDelivery" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceListItem:
      type: object
      required: [id, kind, state, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InvoiceKind" }
        state: { $ref: "#/components/schemas/InvoiceState" }
        number: { type: string }
        buyerName: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        grossAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        updatedAt: { type: string, format: date-time }
    InvoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceListItem" }
        nextCursor: { type: string }
    CreditNoteRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [CREDIT_NOTE, CANCELLATION, CORRECTION]
    SendInvoiceRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, minLength: 3, maxLength: 320, description: "Recipient; defaults in the UI to the customer's email." }
        subject: { type: string, maxLength: 200, description: "Empty = \"Rechnung <number>\"." }
        message: { type: string, maxLength: 4000 }
    CommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    Comment:
      type: object
      required: [id, body, createdAt, authorId]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        authorId: { type: string, format: uuid }
        authorName:
          type: string
          description: Absent when the author is no longer a member.
    CommentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
    ExportKind:
      type: string
      enum: [PERIOD, FULL]
    ExportScope:
      type: string
      description: Received (IN), issued (OUT) or all documents.
      enum: [IN, OUT, ALL]
    ExportState:
      type: string
      enum: [QUEUED, READY, FAILED, EXPIRED]
    ExportRequest:
      type: object
      description: "`from` and `to` are required for PERIOD and ignored for FULL."
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ExportKind" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        scope: { $ref: "#/components/schemas/ExportScope" }
    Export:
      type: object
      required: [id, kind, scope, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ExportKind" }
        from: { type: string, format: date }
        to: { type: string, format: date }
        scope: { $ref: "#/components/schemas/ExportScope" }
        state: { $ref: "#/components/schemas/ExportState" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        fileName: { type: string }
        sizeBytes: { type: integer, format: int64 }
        sha256:
          type: string
          description: SHA-256 of the ZIP.
        documentCount:
          type: integer
          format: int32
          description: Number of documents (PERIOD) or archived originals (FULL) in the ZIP.
        requestedByName: { type: string }
    ExportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Export" }
    DatevChart:
      type: string
      enum: [SKR03, SKR04]
    DatevSettingsUpdate:
      type: object
      required: [chart, fiscalYearStartMonth, accountLength]
      properties:
        consultantNumber:
          type: integer
          format: int32
          minimum: 1001
          maximum: 9999999
          description: DATEV Beraternummer.
        clientNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 99999
          description: DATEV Mandantennummer.
        chart: { $ref: "#/components/schemas/DatevChart" }
        fiscalYearStartMonth: { type: integer, format: int32, minimum: 1, maximum: 12 }
        accountLength:
          type: integer
          format: int32
          minimum: 4
          maximum: 8
          description: Length of general ledger accounts (Sachkontenlänge); personal accounts have one digit more.
        expenseAccount: { type: string, pattern: "^[0-9]{4,9}$", description: "Expense account for received invoices; default from the chart." }
        revenueAccount: { type: string, pattern: "^[0-9]{4,9}$", description: "Revenue account for issued invoices; default from the chart." }
        creditorAccount: { type: string, pattern: "^[0-9]{5,9}$", description: "Creditor (supplier) account; default 70000." }
        debtorAccount: { type: string, pattern: "^[0-9]{5,9}$", description: "Debtor (customer) account; default 10000." }
    DatevSettings:
      type: object
      required: [chart, fiscalYearStartMonth, accountLength, expenseAccount, revenueAccount, creditorAccount, debtorAccount, complete]
      properties:
        consultantNumber: { type: integer, format: int32 }
        clientNumber: { type: integer, format: int32 }
        chart: { $ref: "#/components/schemas/DatevChart" }
        fiscalYearStartMonth: { type: integer, format: int32 }
        accountLength: { type: integer, format: int32 }
        expenseAccount: { type: string, description: The account used (saved or default). }
        revenueAccount: { type: string }
        creditorAccount: { type: string }
        debtorAccount: { type: string }
        complete:
          type: boolean
          description: Consultant and client number are set; without them the DATEV file can't be imported.
    BillingState:
      type: string
      enum: [DISABLED, EXEMPT, TRIAL, ACTIVE, PAST_DUE, READ_ONLY]
    BillingPlan:
      type: string
      enum: [MONTHLY, ANNUAL]
    PlanOffer:
      type: object
      required: [plan, available]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        available:
          type: boolean
          description: A Stripe price is configured for this plan.
        netAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
    SubscriptionInfo:
      type: object
      required: [status, cancelAtPeriodEnd]
      properties:
        status:
          type: string
          description: Stripe's subscription status (active, trialing, past_due, unpaid, canceled …).
        plan: { $ref: "#/components/schemas/BillingPlan" }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
    BillingStatus:
      type: object
      required: [enabled, state, plans, hasCustomer]
      properties:
        enabled: { type: boolean }
        state: { $ref: "#/components/schemas/BillingState" }
        trialEndsAt: { type: string, format: date-time }
        subscription: { $ref: "#/components/schemas/SubscriptionInfo" }
        plans:
          type: array
          items: { $ref: "#/components/schemas/PlanOffer" }
        hasCustomer:
          type: boolean
          description: A Stripe customer exists, so the portal can be opened.
    MaraAddonState:
      type: string
      enum: [DISABLED, NONE, TRIAL, ACTIVE, EXEMPT, READ_ONLY]
    MaraAddon:
      type: object
      required: [offered, state, trialUsed, worksCouncilNoticeAccepted, seats]
      properties:
        offered:
          type: boolean
          description: The add-on is sold here (prices configured); false means MARA is free.
        state: { $ref: "#/components/schemas/MaraAddonState" }
        trialEndsAt: { type: string, format: date-time }
        trialUsed: { type: boolean }
        booked:
          type: boolean
          description: The add-on is on the subscription (or being added).
        pending:
          type: string
          enum: [BOOKING, CANCELLING]
          description: A change requested and not yet confirmed by Stripe.
        worksCouncilNoticeAccepted: { type: boolean }
        seats: { $ref: "#/components/schemas/MaraSeats" }
        price: { $ref: "#/components/schemas/MaraPrice" }
    MaraSeats:
      type: object
      required: [counted, included, extra]
      description: Owners, members and technicians count; tax advisors are free.
      properties:
        counted: { type: integer, format: int32 }
        included: { type: integer, format: int32 }
        extra: { type: integer, format: int32, description: "Seats charged on top (counted − included, at least 0)" }
        billed: { type: integer, format: int32, description: "Extra seats Stripe currently charges" }
    MaraPrice:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        netAmount: { $ref: "#/components/schemas/Money" }
        seatNetAmount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
    MaraTrialRequest:
      type: object
      required: [worksCouncilNoticeAccepted]
      properties:
        worksCouncilNoticeAccepted:
          type: boolean
          description: The owner read the notice on the works council (§ 87 BetrVG) and will hand out the information for employees.
    CheckoutRequest:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        addons:
          type: array
          maxItems: 1
          items: { type: string, enum: [MARA] }
          description: Book MARA with the plan.
        worksCouncilNoticeAccepted:
          type: boolean
          description: With `addons` MARA, the owner's confirmation of the works-council notice (unless given at the trial).
    RedirectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    BillingInvoice:
      type: object
      required: [id, state, currency, netAmount, taxAmount, grossAmount, paidAt]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [ISSUING, ISSUED, REJECTED]
        number: { type: string }
        issueDate: { type: string, format: date }
        currency: { type: string }
        netAmount: { $ref: "#/components/schemas/Money" }
        taxAmount: { $ref: "#/components/schemas/Money" }
        grossAmount: { $ref: "#/components/schemas/Money" }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        paidAt: { type: string, format: date-time }
    BillingInvoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BillingInvoice" }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 128 }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    LocaleChange:
      type: object
      required: [locale]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
    IntakeSender:
      type: object
      required: [id, pattern, createdAt]
      properties:
        id: { type: string, format: uuid }
        pattern: { type: string, description: "An address (rechnung@lieferant.de) or a domain (@lieferant.de)" }
        createdAt: { type: string, format: date-time }
    IntakeSettings:
      type: object
      required: [allowListEnabled, senders]
      properties:
        allowListEnabled: { type: boolean }
        senders:
          type: array
          items: { $ref: "#/components/schemas/IntakeSender" }
    IntakeSettingsUpdate:
      type: object
      required: [allowListEnabled]
      properties:
        allowListEnabled: { type: boolean }
    IntakeSenderRequest:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string, minLength: 3, maxLength: 320 }
    QuarantinedMail:
      type: object
      required: [id, receivedAt]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        sender: { type: string, description: Envelope sender }
        fromAddress: { type: string, description: From header }
        subject: { type: string }
    QuarantineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QuarantinedMail" }
    QuarantineRelease:
      type: object
      properties:
        allowSender: { type: boolean, default: false }
    TransferDetails:
      type: object
      description: |
        The supplier's bank transfer details (AR-06) for a credit transfer in EUR, and the EPC
        QR code payload ("GiroCode", EPC069-12 version 002) that banking apps read.
      required: [name, iban, currency, epcPayload]
      properties:
        name: { type: string, description: "Payee (BT-59), else seller (BT-27)" }
        iban: { type: string, description: BT-84 }
        bic: { type: string, description: BT-86 }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        reference: { type: string, description: "Remittance information (BT-83), else the invoice number" }
        epcPayload: { type: string }
    RecurringInterval:
      type: string
      enum: [MONTHLY, QUARTERLY]
    RecurringInvoiceRequest:
      type: object
      required: [sourceInvoiceId, name, interval, nextRun]
      properties:
        sourceInvoiceId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        interval: { $ref: "#/components/schemas/RecurringInterval" }
        nextRun: { type: string, format: date }
    RecurringInvoiceUpdate:
      type: object
      required: [name, interval, nextRun, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        interval: { $ref: "#/components/schemas/RecurringInterval" }
        nextRun: { type: string, format: date }
        active: { type: boolean }
    RecurringInvoice:
      type: object
      required: [id, name, interval, nextRun, active, sourceInvoiceId, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        interval: { $ref: "#/components/schemas/RecurringInterval" }
        nextRun: { type: string, format: date }
        active: { type: boolean }
        sourceInvoiceId: { type: string, format: uuid }
        buyerName: { type: string }
        lastRun: { type: string, format: date }
        lastDraftId: { type: string, format: uuid }
        version: { type: integer, format: int32 }
    RecurringInvoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RecurringInvoice" }
