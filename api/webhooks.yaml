openapi: 3.1.0
info:
  title: ERIKA webhooks (provider callbacks)
  version: 0.2.0
  description: |
    Callbacks from external providers. Not part of the public API (`openapi.yaml`): they live
    outside `/api/v1`, need no session or CSRF token, and authenticate with a shared secret.
    Implemented by hand: `de.erika.creator.web.MailWebhookController` (ADR 0031) and
    `de.erika.billing.web.StripeWebhookController` (ADR 0033).

    The outgoing mail provider is not chosen yet (docs/legal/README.md). This endpoint takes
    a provider-neutral event; when the provider is chosen, its own payload is mapped here (or a
    second endpoint is added for it) without changing how ERIKA records deliveries.
servers:
  - url: /
security:
  - webhookSecret: []
paths:
  /webhooks/mail:
    post:
      operationId: receiveMailEvent
      summary: Delivery result of a sent invoice email (CR-07)
      description: |
        Matched to the delivery by `messageId` (our Message-ID or the provider's ID from the
        SMTP answer). Unknown IDs are acknowledged with 202 and ignored, so the provider doesn't
        retry forever. Repeated events are harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailEvent" }
            example: { messageId: "<3f2b0c1e-6a7d-4d43-9f55-0d6b8c1a2e4f@erika.local>", event: "BOUNCED", detail: "550 5.1.1 mailbox unavailable" }
      responses:
        "202": { description: Received. }
        "400": { description: Malformed event. }
        "401": { description: Missing or wrong secret. }
  /webhooks/stripe:
    post:
      operationId: receiveStripeEvent
      summary: Stripe event (subscriptions, invoices, checkout) (EX-03)
      description: |
        Authenticated by Stripe's signature (`Stripe-Signature`, HMAC-SHA256 over the raw body
        with the endpoint secret, at most 5 minutes old). Stored by event ID, so a repeated
        delivery is acknowledged without being processed twice; the worker processes it.
        Handled: `checkout.session.completed`, `customer.subscription.created|updated|deleted`,
        `invoice.paid`, `invoice.payment_failed`; others are acknowledged and ignored.
      security:
        - stripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StripeEvent" }
            example: { id: "evt_1QaBcD", type: "invoice.paid", created: 1767225600, data: { object: { id: "in_1QaBcD", object: "invoice" } } }
      responses:
        "200": { description: Received. }
        "400": { description: "Wrong or missing signature, or not an event." }
components:
  securitySchemes:
    webhookSecret:
      type: apiKey
      in: header
      name: X-Erika-Webhook-Secret
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
  schemas:
    MailEvent:
      type: object
      required: [messageId, event]
      properties:
        messageId: { type: string, minLength: 1, maxLength: 300 }
        event:
          type: string
          enum: [DELIVERED, BOUNCED, FAILED, COMPLAINED]
        detail:
          type: string
          maxLength: 500
          description: The provider's reason (SMTP status text). Stored as it is; must not contain invoice content.
        occurredAt: { type: string, format: date-time }
    StripeEvent:
      type: object
      required: [id, type, created, data]
      description: Stripe's event object; only the fields ERIKA reads are listed.
      properties:
        id: { type: string }
        type: { type: string }
        created: { type: integer, format: int64, description: Unix time }
        data:
          type: object
          properties:
            object: { type: object }
