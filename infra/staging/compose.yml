# Staging: one small server (Software Design §8), anonymised test data only.
# Deployed by .github/workflows/ci.yml on tags (v*) via deploy.sh.
# Values come from /opt/erika/.env (see .env.example; secrets encrypted with SOPS in the repo).
name: erika

x-backend: &backend
  image: ghcr.io/${ERIKA_IMAGE_REPO}/backend:${ERIKA_IMAGE_TAG:?set by deploy.sh}
  restart: unless-stopped
  environment: &backend-env
    ERIKA_ENVIRONMENT: staging
    ERIKA_DB_URL: jdbc:postgresql://postgres:5432/erika?currentSchema=erika
    ERIKA_DB_APP_PASSWORD: ${ERIKA_DB_APP_PASSWORD:?}
    ERIKA_DB_OWNER_PASSWORD: ${ERIKA_DB_OWNER_PASSWORD:?}
    ERIKA_S3_ENDPOINT: ${ERIKA_S3_ENDPOINT:?}
    ERIKA_S3_REGION: ${ERIKA_S3_REGION:-eu-central}
    ERIKA_S3_BUCKET: ${ERIKA_S3_BUCKET:?}
    ERIKA_S3_ACCESS_KEY: ${ERIKA_S3_ACCESS_KEY:?}
    ERIKA_S3_SECRET_KEY: ${ERIKA_S3_SECRET_KEY:?}
    ERIKA_S3_PATH_STYLE: ${ERIKA_S3_PATH_STYLE:-false}
    ERIKA_SENTRY_DSN: ${ERIKA_SENTRY_DSN:-}
    ERIKA_BACKUP_BUCKET: ${ERIKA_BACKUP_BUCKET:?}
    ERIKA_ARCHIVE_OBJECT_LOCK: ${ERIKA_ARCHIVE_OBJECT_LOCK:-COMPLIANCE}
    ERIKA_TOTP_ENCRYPTION_KEY: ${ERIKA_TOTP_ENCRYPTION_KEY:?}
    ERIKA_WEB_BASE_URL: https://${ERIKA_DOMAIN:?}
    ERIKA_MAIL_FROM: ${ERIKA_MAIL_FROM:?}
    ERIKA_SMTP_HOST: ${ERIKA_SMTP_HOST:?}
    ERIKA_SMTP_PORT: ${ERIKA_SMTP_PORT:-587}
    ERIKA_SMTP_USER: ${ERIKA_SMTP_USER:-}
    ERIKA_SMTP_PASSWORD: ${ERIKA_SMTP_PASSWORD:-}
    ERIKA_S3_UPLOADS_BUCKET: ${ERIKA_S3_UPLOADS_BUCKET:?}
    ERIKA_S3_DERIVED_BUCKET: ${ERIKA_S3_DERIVED_BUCKET:?}
    ERIKA_CLAMAV_HOST: clamav
    ERIKA_INTAKE_MAIL_DOMAIN: ${ERIKA_INTAKE_MAIL_DOMAIN:?}
    ERIKA_INTAKE_MAIL_SECRET: ${ERIKA_INTAKE_MAIL_SECRET:?}
    # Closed beta as in production (ADR 0030); links from invite.py.
    ERIKA_SIGNUP_MODE: ${ERIKA_SIGNUP_MODE:-INVITE_ONLY}
    ERIKA_INVITE_SECRET: ${ERIKA_INVITE_SECRET:?}
    ERIKA_FEEDBACK_TO: ${ERIKA_FEEDBACK_TO:-}
    ERIKA_MAIL_WEBHOOK_SECRET: ${ERIKA_MAIL_WEBHOOK_SECRET:-}
  depends_on:
    postgres: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ERIKA_DOMAIN: ${ERIKA_DOMAIN:?}
      STAGING_USER: ${STAGING_USER:?}
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # PostgreSQL with pgBackRest (ADR 0028), as in production: WAL archiving into the staging
  # backup bucket, so restore drills run here first (docs/ops/restore.md).
  postgres:
    image: ghcr.io/${ERIKA_IMAGE_REPO}/postgres:${ERIKA_POSTGRES_IMAGE_TAG:?}
    restart: unless-stopped
    env_file: [pgbackrest.env]
    environment:
      POSTGRES_DB: erika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      ERIKA_DB_APP_PASSWORD: ${ERIKA_DB_APP_PASSWORD:?}
      ERIKA_DB_OWNER_PASSWORD: ${ERIKA_DB_OWNER_PASSWORD:?}
      ERIKA_WAL_ARCHIVE: ${ERIKA_WAL_ARCHIVE:-on}
    command: ["postgres", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgspool:/var/spool/pgbackrest
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erika"]
      interval: 5s
      retries: 20

  api:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: api
    # Management port only on the host loopback, for deploy.sh health checks.
    ports: ["127.0.0.1:8081:8081"]

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: worker
    depends_on:
      api: { condition: service_started }
      clamav: { condition: service_healthy }

  # Virus scanner for uploads and email attachments (NF-04); freshclam updates signatures.
  clamav:
    image: clamav/clamav:1.4.7
    restart: unless-stopped
    volumes: [clamav_db:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      retries: 10
      start_period: 180s

  # Inbound mail for intake addresses (IN-01, ADR 0024). Port 25 must be open (spike S5-a).
  mail:
    image: ghcr.io/${ERIKA_IMAGE_REPO}/mail:${ERIKA_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    ports: ["25:25"]
    environment:
      ERIKA_INTAKE_MAIL_DOMAIN: ${ERIKA_INTAKE_MAIL_DOMAIN:?}
      ERIKA_API_URL: http://api:8080
      ERIKA_INTAKE_MAIL_SECRET: ${ERIKA_INTAKE_MAIL_SECRET:?}
      MAIL_HOSTNAME: ${ERIKA_MAIL_HOSTNAME:?}
      TLS_CERT: ${ERIKA_MAIL_TLS_CERT:-}
      TLS_KEY: ${ERIKA_MAIL_TLS_KEY:-}
    depends_on:
      api: { condition: service_started }
      clamav: { condition: service_healthy }

  web:
    image: ghcr.io/${ERIKA_IMAGE_REPO}/frontend:${ERIKA_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      ERIKA_API_INTERNAL_URL: http://api:8080
      ERIKA_BETA_CONTACT: ${ERIKA_FEEDBACK_TO:-}

volumes:
  pgdata:
  pgspool:
  clamav_db:
  caddy_data:
  caddy_config:
