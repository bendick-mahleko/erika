# Non-secret settings of the production environment (ADR 0027). Secrets: ../production/secrets.sops.yaml.
erika_repo_root: "{{ playbook_dir }}/../.."
erika_image_repo: "<github-owner>/<repo>"   # lowercase, as on ghcr.io
erika_postgres_image_tag: "16.15-<short sha>"
erika_timezone: Europe/Berlin

erika_mail_hostname: "mx.{{ erika_domain }}"
erika_intake_mail_domain: "in.{{ erika_domain }}"
erika_acme_email: "ops@{{ erika_domain }}"
erika_mail_from: "ERIKA <no-reply@{{ erika_domain }}>"
erika_feedback_to: "beta@{{ erika_domain }}"
erika_signup_mode: INVITE_ONLY
erika_terms_version: beta-2026-12

# Billing with Stripe (ADR 0033, docs/ops/billing.md): off during the closed beta. Price and tax
# rate IDs come from the Stripe dashboard once pricing is decided; the issuer workspace is
# ERIKA's own workspace in production.
erika_billing_enabled: false
erika_stripe_price_monthly: ""
erika_stripe_price_annual: ""
# MARA add-on (Stage 10, ADR 0043); empty = not offered.
erika_stripe_price_mara_monthly: ""
erika_stripe_price_mara_annual: ""
erika_stripe_price_mara_seat_monthly: ""
erika_stripe_price_mara_seat_annual: ""
erika_stripe_tax_rate: ""
erika_billing_issuer_workspace: ""

# Object storage (ADR 0028)
erika_s3_primary_location: fsn1
erika_s3_backup_location: nbg1
erika_bucket_prefix: erika-prod

# Alerting (ADR 0029)
erika_alert_email_to: "ops@{{ erika_domain }}"
erika_alert_mail_from: "ERIKA Monitoring <monitoring@{{ erika_domain }}>"
erika_alert_smtp_port: 587
erika_alert_pushover_enabled: false

# Self-hosted runner for deployments (ADR 0027)
erika_github_repository: "<github-owner>/<repo>"
erika_runner_version: "2.329.0"

# Backup schedule (systemd OnCalendar, Europe/Berlin)
erika_backup_full_calendar: "*-*-* 01:30:00"
erika_backup_check_calendar: "hourly"
erika_replication_calendar: "*-*-* 02:30:00"
# Monthly restore drill on the database server, into a temporary volume (docs/ops/restore.md).
erika_restore_drill_calendar: "Sun *-*-01..07 04:00:00"
