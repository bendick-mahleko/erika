# Base for every server: updates, time, SSH hardening, Docker, metrics directory.
- name: Set the time zone
  community.general.timezone:
    name: "{{ erika_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, unattended-upgrades, apt-listchanges, jq, python3-docker, cryptsetup]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Automatic security updates, with reboot at night if needed
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52erika-unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:45";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";

- name: Enable the periodic apt jobs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: SSH key-only, no root, only the admin user (also set by cloud-init)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-erika.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers erika
      X11Forwarding no
      MaxAuthTries 3
  notify: Restart ssh

- name: Limit the journal (logs leave the servers through Alloy → Loki)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/erika.conf
    mode: "0644"
    content: |
      [Journal]
      SystemMaxUse=1G
      MaxRetentionSec=14day
  notify: Restart journald

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present

- name: Docker daemon settings (log rotation, containers survive daemon restarts)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" },
        "live-restore": true
      }
  notify: Restart docker

- name: Admin user may use Docker
  ansible.builtin.user:
    name: erika
    groups: docker
    append: true

- name: Directory for node_exporter's textfile collector (backup results)
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"

- name: Directory for drill reports
  ansible.builtin.file:
    path: /var/log/erika
    state: directory
    mode: "0750"
