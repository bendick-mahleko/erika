# Structure of infra/production/secrets.sops.yaml (encrypt with: sops -e -i secrets.sops.yaml).
# The age key that decrypts it lives with the administrators and in the offline recovery
# kit (docs/ops/production.md#secrets) — never on a server, never in Git in plain text.
erika_db_superuser_password: ""
erika_db_owner_password: ""
erika_db_app_password: ""
erika_db_monitor_password: ""

erika_s3_primary_access_key: ""      # project erika-prod
erika_s3_primary_secret_key: ""
erika_s3_backup_access_key: ""       # project erika-backup (db server only)
erika_s3_backup_secret_key: ""
erika_pgbackrest_cipher_pass: ""     # `openssl rand -base64 48`; losing it = losing every backup

erika_totp_encryption_key: ""        # `openssl rand -base64 32`
erika_intake_mail_secret: ""         # `openssl rand -hex 32`
erika_mail_webhook_secret: ""        # `openssl rand -hex 32`; delivery webhook of the mail provider (ADR 0031)
erika_invite_secret: ""              # `openssl rand -hex 32`
erika_smtp_host: ""
erika_smtp_user: ""
erika_smtp_password: ""
erika_sentry_dsn: ""                 # from GlitchTip, after the ops server is up

erika_alert_smtp_host: ""
erika_alert_smtp_user: ""
erika_alert_smtp_password: ""
erika_alert_pushover_user_key: ""
erika_alert_pushover_token: ""
erika_deadmans_switch_url: ""        # external heartbeat check (e.g. a healthchecks.io ping URL)

erika_grafana_admin_password: ""
erika_glitchtip_db_password: ""
erika_glitchtip_secret_key: ""
erika_glitchtip_email_url: ""        # smtp://user:password@host:587

erika_ci_runner_token: ""            # one-time GitHub runner registration token (optional)
erika_ghcr_user: ""                  # GitHub user of the read:packages token
erika_ghcr_token: ""                 # fine-grained token, read:packages only (private images)
