# PostgreSQL client authentication on the production database server (ADR 0027).
# TYPE     DATABASE  USER                     ADDRESS          METHOD
# Inside the container only (pgBackRest, health checks, `docker compose exec psql`): the
# socket is not reachable from outside the container, as in the official image.
local      all       all                                       trust
host       all       postgres                 127.0.0.1/32     scram-sha-256
# The app server over the private network: TLS only (Software Design §7: TLS everywhere).
hostssl    erika     erika_app,erika_owner    10.0.1.10/32     scram-sha-256
# Restore drills and admin tunnels from the ops server use the same rule set.
hostssl    erika     erika_owner              10.0.1.30/32     scram-sha-256
# postgres_exporter in the same Compose network.
host       erika     erika_monitor            172.16.0.0/12    scram-sha-256
# Everything else is refused.
host       all       all                      0.0.0.0/0        reject
host       all       all                      ::/0             reject
