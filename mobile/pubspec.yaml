name: mara
description: "MARA – Mobile Arbeitsberichte, Rechnungen und Aufmaße: the technician app of the ERIKA add-on."
publish_to: 'none'

# Keep in step with lib/app/version.dart (checked by test/version_test.dart).
version: 0.2.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  cryptography: ^2.9.0
  decimal: ^3.2.7
  drift: ^2.35.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  rational: ^2.2.3
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  connectivity_plus: ^7.3.2
  pdf: ^3.13.1
  printing: ^5.15.1
  barcode: ^2.2.9
  sentry_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0

# The local database is encrypted with SQLCipher (MARA design M1, ADR 0040). package:sqlite3 3.x
# bundles the native library through build hooks; this selects its SQLCipher build. The app
# refuses to open a database that turns out not to be encrypted (lib/data/local/database.dart).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
