include: package:flutter_lints/flutter.yaml

# Same width as `dart format --line-length 100` in CI; gen-l10n formats its output with it.
formatter:
  page_width: 100

analyzer:
  exclude:
    - "**/*.g.dart"
    - lib/l10n/gen/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
