[versions]
kotlin = "2.4.21"
spring-boot = "4.2.0"
spring-modulith = "2.2.0"
openapi-generator = "7.14.0"
spotless = "8.12.0"
ktlint = "1.8.0"
awssdk = "2.59.7"
sentry = "8.65.0"

[libraries]
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
sentry-spring-boot = { module = "io.sentry:sentry-spring-boot-4-starter", version.ref = "sentry" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
