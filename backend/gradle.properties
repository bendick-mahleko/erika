org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin usage statistics: off. At build end the plugin sorts every file in
# ~/.gradle/kotlin-profile, which can stall builds for minutes on machines
# where that directory has grown large.
kotlin.internal.collectFUSMetrics=false
kotlin.code.style=official
