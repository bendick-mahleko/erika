# Common configuration. Secrets and environment-specific values come from
# environment variables (12-factor); see .env.example and docs/dev-setup.md.
spring:
  application:
    name: erika
  threads:
    virtual:
      enabled: true
  datasource:
    # The app connects as erika_app: no superuser, no BYPASSRLS, no DDL (Software Design §7).
    url: ${ERIKA_DB_URL:jdbc:postgresql://localhost:5432/erika?currentSchema=erika}
    username: ${ERIKA_DB_APP_USER:erika_app}
    password: ${ERIKA_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${ERIKA_DB_POOL_SIZE:10}
  flyway:
    # Migrations run as the schema owner, never as the app role.
    user: ${ERIKA_DB_OWNER_USER:erika_owner}
    password: ${ERIKA_DB_OWNER_PASSWORD:}
    default-schema: erika
    schemas: erika
    create-schemas: false
  # Jackson 3 (Boot 4) writes java.time values as ISO 8601 strings by default.
  # Omit nulls: optional fields in the OpenAPI contract are absent, not null.
  jackson:
    default-property-inclusion: non_null
  # Account emails (identity); texts in i18n/mail_*.properties, German first.
  messages:
    basename: i18n/mail
    fallback-to-system-locale: false
  mail:
    host: ${ERIKA_SMTP_HOST:localhost}
    port: ${ERIKA_SMTP_PORT:1025}
    username: ${ERIKA_SMTP_USER:}
    password: ${ERIKA_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.starttls.enable]": ${ERIKA_SMTP_STARTTLS:true}
  # Server-side sessions in PostgreSQL (ADR 0008); tables come from Flyway.
  session:
    jdbc:
      initialize-schema: never
      table-name: erika.spring_session
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${ERIKA_HTTP_PORT:8080}
  servlet:
    session:
      # 12 h idle timeout (Software Design §7).
      timeout: 12h
      cookie:
        name: ERIKA_SESSION
        http-only: true
        secure: ${ERIKA_SECURE_COOKIES:true}
        same-site: lax
  shutdown: graceful
  forward-headers-strategy: framework

management:
  # Actuator on a separate port that the reverse proxy doesn't route.
  server:
    port: ${ERIKA_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ${ERIKA_LOG_FORMAT:ecs}

sentry:
  # GlitchTip (Sentry-compatible). Empty DSN disables error reporting.
  dsn: ${ERIKA_SENTRY_DSN:}
  environment: ${ERIKA_ENVIRONMENT:local}
  send-default-pii: false

erika:
  version: ${ERIKA_VERSION:dev}
  storage:
    endpoint: ${ERIKA_S3_ENDPOINT:}
    region: ${ERIKA_S3_REGION:eu-central-1}
    bucket: ${ERIKA_S3_BUCKET:erika-originals}
    access-key: ${ERIKA_S3_ACCESS_KEY}
    secret-key: ${ERIKA_S3_SECRET_KEY}
    path-style: ${ERIKA_S3_PATH_STYLE:true}
    # Quarantine for uploads until they are virus-scanned (no Object Lock; lifecycle expiry 1 day).
    uploads-bucket: ${ERIKA_S3_UPLOADS_BUCKET:erika-uploads}
    # PDF view copies and decoded attachments, rebuilt from originals when needed.
    derived-bucket: ${ERIKA_S3_DERIVED_BUCKET:erika-derived}
    # Endpoint for pre-signed upload URLs as the browser sees it; empty = same as endpoint.
    public-endpoint: ${ERIKA_S3_PUBLIC_ENDPOINT:}
  jobs:
    batch-size: 10
    lease: 5m
    poll-interval: 1s
  identity:
    totp-encryption-key: ${ERIKA_TOTP_ENCRYPTION_KEY:}
    secure-cookies: ${ERIKA_SECURE_COOKIES:true}
  mail:
    from: ${ERIKA_MAIL_FROM:ERIKA <no-reply@erika.local>}
    web-base-url: ${ERIKA_WEB_BASE_URL:http://localhost:3000}
  audit:
    head-bucket: ${ERIKA_BACKUP_BUCKET:erika-backups}
  archive:
    # COMPLIANCE: S3 Object Lock until the retention date (ADR 0013, 0022). NONE only for
    # a provider without Object Lock (documented fallback).
    object-lock: ${ERIKA_ARCHIVE_OBJECT_LOCK:COMPLIANCE}
  intake:
    # Intake addresses are <token>@<mail-domain> (IN-01).
    mail-domain: ${ERIKA_INTAKE_MAIL_DOMAIN:in.erika.local}
    # Shared secret of the mail server (Postfix → /internal/intake/**). Empty disables mail intake.
    mail-secret: ${ERIKA_INTAKE_MAIL_SECRET:}
    clamav:
      host: ${ERIKA_CLAMAV_HOST:localhost}
      port: ${ERIKA_CLAMAV_PORT:3310}
  validation:
    # Assembled validation packs (./gradlew prepareValidationPacks; /app/validation-packs in the image).
    packs-dir: ${ERIKA_VALIDATION_PACKS_DIR:build/validation-packs}
  worker:
    heartbeat-interval: 30s
    stale-after: 2m
    # Prometheus endpoint of the worker (/metrics); -1 = off (ADR 0029).
    metrics-port: ${ERIKA_WORKER_METRICS_PORT:8082}
  signup:
    # INVITE_ONLY during the closed beta (ADR 0030); links from infra/production/invite.py.
    mode: ${ERIKA_SIGNUP_MODE:OPEN}
    invite-secret: ${ERIKA_INVITE_SECRET:}
    terms-version: ${ERIKA_TERMS_VERSION:beta-2026-12}
  feedback:
    # Team address for in-app feedback; empty = stored only.
    to: ${ERIKA_FEEDBACK_TO:}
  creator:
    # Shared secret of the mail provider's delivery webhook (POST /webhooks/mail); empty disables it.
    webhook-secret: ${ERIKA_MAIL_WEBHOOK_SECRET:}
