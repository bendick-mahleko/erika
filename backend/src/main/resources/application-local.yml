# Local development against infra/local/compose.yml. Dev-only credentials.
spring:
  datasource:
    password: ${ERIKA_DB_APP_PASSWORD:erika_app_dev}
  flyway:
    password: ${ERIKA_DB_OWNER_PASSWORD:erika_owner_dev}
  mail:
    properties:
      "[mail.smtp.starttls.enable]": false

logging:
  structured:
    format:
      console: ${ERIKA_LOG_FORMAT:}

server:
  servlet:
    session:
      cookie:
        # Plain http on localhost.
        secure: false

erika:
  # MARA is on locally, so the add-on can be developed and tried (ADR 0036).
  features:
    mara: ${ERIKA_FEATURE_MARA:true}
  identity:
    # DEV-ONLY key. Production: generate with `openssl rand -base64 32`, keep in SOPS.
    totp-encryption-key: ${ERIKA_TOTP_ENCRYPTION_KEY:ZGV2LW9ubHktdG90cC1rZXktMzItYnl0ZXMtbG9uZyE=}
    secure-cookies: false
  storage:
    endpoint: ${ERIKA_S3_ENDPOINT:http://localhost:9000}
    access-key: ${ERIKA_S3_ACCESS_KEY:erika-dev}
    secret-key: ${ERIKA_S3_SECRET_KEY:erika-dev-secret}
    # The browser uploads to the S3 port on localhost (compose maps it to 9000).
    public-endpoint: ${ERIKA_S3_PUBLIC_ENDPOINT:http://localhost:9000}
  intake:
    # DEV-ONLY secret, shared with the local mail container (infra/local/compose.yml).
    mail-secret: ${ERIKA_INTAKE_MAIL_SECRET:dev-intake-secret}
