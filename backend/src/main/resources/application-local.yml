# Local development against infra/local/compose.yml. Dev-only credentials.
spring:
  datasource:
    password: ${ERIKA_DB_APP_PASSWORD:erika_app_dev}
  flyway:
    password: ${ERIKA_DB_OWNER_PASSWORD:erika_owner_dev}

logging:
  structured:
    format:
      console: ${ERIKA_LOG_FORMAT:}

erika:
  storage:
    endpoint: ${ERIKA_S3_ENDPOINT:http://localhost:9000}
    access-key: ${ERIKA_S3_ACCESS_KEY:erika-dev}
    secret-key: ${ERIKA_S3_SECRET_KEY:erika-dev-secret}
