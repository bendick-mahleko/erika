# Account emails (German first, NF-13). MessageFormat: {0} = display name.
# Write a literal apostrophe as two: ''
mail.verify.subject=Bitte bestätigen Sie Ihre E-Mail-Adresse
mail.verify.body=Hallo {0},\n\nwillkommen bei ERIKA! Bitte bestätigen Sie Ihre E-Mail-Adresse mit diesem Link (48 Stunden gültig):\n\n{1}\n\nWenn Sie sich nicht bei ERIKA registriert haben, können Sie diese E-Mail ignorieren.\n\nIhr ERIKA-Team
mail.exists.subject=Registrierung mit Ihrer E-Mail-Adresse
mail.exists.body=Hallo {0},\n\njemand hat versucht, mit Ihrer E-Mail-Adresse ein neues ERIKA-Konto anzulegen. Sie haben bereits ein Konto. Hier melden Sie sich an:\n\n{1}\n\nWaren Sie das nicht, müssen Sie nichts tun.\n\nIhr ERIKA-Team
mail.locked.subject=Ihr ERIKA-Konto wurde vorübergehend gesperrt
mail.locked.body=Hallo {0},\n\nnach mehreren fehlgeschlagenen Anmeldeversuchen ist Ihr Konto für {1} Minuten gesperrt.\n\nWaren Sie das nicht, versucht möglicherweise jemand, sich mit Ihrer E-Mail-Adresse anzumelden. Ihr Konto bleibt durch die Zwei-Faktor-Anmeldung geschützt.\n\nIhr ERIKA-Team
mail.newdevice.subject=Neue Anmeldung bei ERIKA
mail.newdevice.body=Hallo {0},\n\nIhr Konto wurde gerade auf einem neuen Gerät angemeldet:\n\n{1}\n\nWaren Sie das nicht, ändern Sie bitte sofort Ihr Passwort und informieren Sie uns.\n\nIhr ERIKA-Team
mail.newdocuments.subject=Neue Dokumente in ERIKA
mail.newdocuments.body=Hallo {0},\n\n{1,choice,1#ein neues Dokument ist|1<{1} neue Dokumente sind} {2} in ERIKA eingegangen.\n\nZum Eingang:\n{3}\n\nSie erhalten diese E-Mail, weil Sie Benachrichtigungen über neue Dokumente eingeschaltet haben. Abschalten können Sie das in den Einstellungen.\n\nIhr ERIKA-Team
mail.newdocuments.via.email=per E-Mail
mail.newdocuments.via.upload=per Upload
mail.invitation.subject={0} lädt Sie zu ERIKA ein
mail.invitation.body=Guten Tag,\n\n{0} lädt Sie ein, im ERIKA-Arbeitsbereich „{1}“ mitzuarbeiten, als {2}.\n\nMit diesem Link nehmen Sie die Einladung an (7 Tage gültig). Haben Sie noch kein ERIKA-Konto, legen Sie dort eines an:\n\n{3}\n\nKennen Sie den Absender nicht, können Sie diese E-Mail ignorieren.\n\nIhr ERIKA-Team
mail.role.MEMBER=Teammitglied
mail.role.ADVISOR=Steuerberater/in (lesen, kommentieren und exportieren, keine Änderungen)
mail.export.subject=Ihr ERIKA-Export ist fertig
mail.export.body=Hallo {0},\n\nIhr Export ({1}) steht bereit. Nach der Anmeldung laden Sie ihn hier herunter:\n\n{2}\n\nDer Download ist bis {3} möglich, danach wird die Datei gelöscht.\n\nIhr ERIKA-Team
mail.export.failed.subject=Ihr ERIKA-Export ist fehlgeschlagen
mail.export.failed.body=Hallo {0},\n\nIhr Export ({1}) konnte nicht erstellt werden. Bitte versuchen Sie es später erneut; das ERIKA-Team ist informiert.\n\n{2}\n\nIhr ERIKA-Team
mail.export.kind.PERIOD=Zeitraum {0} bis {1}
mail.export.kind.FULL=vollständiger Kontoexport\n
