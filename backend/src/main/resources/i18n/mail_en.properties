# Account emails, English. MessageFormat: {0} = display name.
# Write a literal apostrophe as two: ''
mail.verify.subject=Please confirm your email address
mail.verify.body=Hello {0},\n\nwelcome to ERIKA! Please confirm your email address with this link (valid for 48 hours):\n\n{1}\n\nIf you didn''t sign up for ERIKA, you can ignore this email.\n\nYour ERIKA team
mail.exists.subject=Sign-up with your email address
mail.exists.body=Hello {0},\n\nsomeone tried to create a new ERIKA account with your email address. You already have an account. Sign in here:\n\n{1}\n\nIf this wasn''t you, there''s nothing you need to do.\n\nYour ERIKA team
mail.locked.subject=Your ERIKA account has been locked for a while
mail.locked.body=Hello {0},\n\nafter several failed sign-in attempts your account is locked for {1} minutes.\n\nIf this wasn''t you, someone may be trying to sign in with your email address. Your account stays protected by two-factor sign-in.\n\nYour ERIKA team
mail.newdevice.subject=New sign-in to ERIKA
mail.newdevice.body=Hello {0},\n\nyour account was just signed in on a new device:\n\n{1}\n\nIf this wasn''t you, please change your password immediately and let us know.\n\nYour ERIKA team
mail.newdocuments.subject=New documents in ERIKA
mail.newdocuments.body=Hello {0},\n\n{1,choice,1#one new document has|1<{1} new documents have} arrived in ERIKA {2}.\n\nGo to the inbox:\n{3}\n\nYou receive this email because you turned on notifications about new documents. You can turn them off in the settings.\n\nYour ERIKA team
mail.newdocuments.via.email=by email
mail.newdocuments.via.upload=by upload
mail.invitation.subject={0} invites you to ERIKA
mail.invitation.body=Hello,\n\n{0} invites you to work in the ERIKA workspace “{1}” as {2}.\n\nAccept the invitation with this link (valid for 7 days). If you don''t have an ERIKA account yet, you can create one there:\n\n{3}\n\nIf you don''t know the sender, you can ignore this email.\n\nYour ERIKA team
mail.role.MEMBER=team member
mail.role.ADVISOR=tax advisor (read, comment and export, no changes)
mail.role.TECHNICIAN=technician (works in the MARA app)
mail.export.subject=Your ERIKA export is ready
mail.export.body=Hello {0},\n\nyour export ({1}) is ready. Sign in and download it here:\n\n{2}\n\nYou can download it until {3}; then the file is deleted.\n\nYour ERIKA team
mail.export.failed.subject=Your ERIKA export failed
mail.export.failed.body=Hello {0},\n\nyour export ({1}) could not be created. Please try again later; the ERIKA team has been notified.\n\n{2}\n\nYour ERIKA team
mail.export.kind.PERIOD=period {0} to {1}
mail.export.kind.FULL=full account export\n
mail.billing.failed.subject=ERIKA payment failed
mail.billing.failed.body=Hello {0},\n\nthe payment for your ERIKA subscription failed. Stripe will try again over the next days. Please check your payment method so your account doesn''t become read-only:\n\n{1}\n\nYour ERIKA team
mail.reset.subject=Reset your ERIKA password
mail.reset.body=Hello {0},\n\nset a new password with this link (valid for 1 hour, single use):\n\n{1}\n\nYour second factor (authenticator app) stays the same. If you didn''t ask for this, ignore this email; your password stays as it is.\n\nYour ERIKA team
mail.pwchanged.subject=Your ERIKA password was changed
mail.pwchanged.body=Hello {0},\n\nthe password of your ERIKA account was just changed; other sign-ins were ended.\n\nIf this wasn''t you, reset your password at once and tell us:\n\n{1}\n\nYour ERIKA team
mail.due.subject=Invoices due in ERIKA
mail.due.body=Hello {0},\n\nthese invoices are due in 3 days ({1}):\n\n{2}\n\nTo your inbox:\n{3}\n\nYou get this reminder because it is switched on in your settings.\n\nYour ERIKA team
mail.recurring.subject=New invoice draft from “{0}”
mail.recurring.body=Hello {1},\n\nthe recurring invoice “{0}” created a draft for the period {2}. Please check and issue it:\n\n{3}\n\nYour ERIKA team
