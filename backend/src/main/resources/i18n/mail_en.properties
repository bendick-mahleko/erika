# Account emails, English. MessageFormat: {0} = display name.
# Write a literal apostrophe as two: ''
mail.verify.subject=Please confirm your email address
mail.verify.body=Hello {0},\n\nwelcome to ERIKA! Please confirm your email address with this link (valid for 48 hours):\n\n{1}\n\nIf you didn''t sign up for ERIKA, you can ignore this email.\n\nYour ERIKA team
mail.exists.subject=Sign-up with your email address
mail.exists.body=Hello {0},\n\nsomeone tried to create a new ERIKA account with your email address. You already have an account. Sign in here:\n\n{1}\n\nIf this wasn''t you, there''s nothing you need to do.\n\nYour ERIKA team
mail.locked.subject=Your ERIKA account has been locked for a while
mail.locked.body=Hello {0},\n\nafter several failed sign-in attempts your account is locked for {1} minutes.\n\nIf this wasn''t you, someone may be trying to sign in with your email address. Your account stays protected by two-factor sign-in.\n\nYour ERIKA team
mail.newdevice.subject=New sign-in to ERIKA
mail.newdevice.body=Hello {0},\n\nyour account was just signed in on a new device:\n\n{1}\n\nIf this wasn''t you, please change your password immediately and let us know.\n\nYour ERIKA team
