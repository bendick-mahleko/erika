spring:
  mail:
    properties:
      "[mail.smtp.starttls.enable]": false

server:
  servlet:
    session:
      cookie:
        secure: false

erika:
  features:
    mara: true
  identity:
    totp-encryption-key: dGVzdC1vbmx5LXRvdHAta2V5LTMyLWJ5dGVzLWxvbmc=
    secure-cookies: false
  intake:
    mail-secret: test-intake-secret
  creator:
    webhook-secret: test-webhook-secret
  # No calls to the breach API from tests (PasswordPolicyTest covers it with a fake server).
  passwords:
    breach-check: false
  # Billing on in tests, against FakeStripe (base URL from TestInfrastructure); issuer = ERIKA's
  # own workspace, created by BillingIT.
  billing:
    enabled: true
    stripe-secret-key: sk_test_erika
    stripe-webhook-secret: whsec_test_erika
    price-monthly: price_monthly
    price-annual: price_annual
    price-mara-monthly: price_mara_monthly
    price-mara-annual: price_mara_annual
    price-mara-seat-monthly: price_mara_seat_monthly
    price-mara-seat-annual: price_mara_seat_annual
    tax-rate-id: txr_test_19
    issuer-workspace-id: 00000000-0000-4000-8000-0000000e41ca

logging:
  structured:
    format:
      console: ""
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
